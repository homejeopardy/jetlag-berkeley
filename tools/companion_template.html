<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#D7263D">
<title>Hide + Seek Relay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --ink:#15171B; --ink-2:#3C4048; --ink-3:#6E737C; --line:#D9D5CB;
  --bg:#EDEAE1; --card:#FFFFFF; --card-2:#F6F4EE;
  --yellow:#F5C400; --yellow-2:#FFE27A; --red:#D62828; --green:#1F8A5B; --blue:#0077B6;
  --hider:#8338EC; --seeker:#0077B6;
  --shadow:4px 4px 0 var(--ink);
  --brand-bg:#F5C400; --brand-fg:#15171B; --top-bg:var(--bg); --top-fg:var(--ink);
  --stripe:linear-gradient(90deg,#FDB913 0 33.4%,#F58220 33.4% 66.7%,#E23B2E 66.7%);
  --zone-glow:#F5C400; --zone-line:#15171B; --ruled:#2B2A27; --ruled-op:.42;
  --ans-fill:#5F5A52; --hatch-op:.26;
}
/* Hide + Seek: the red of the box, the sunset stripe, warm paper. */
:root[data-theme="hideseek"]{
  --ink:#1C1A1F; --ink-2:#48424C; --ink-3:#7C7580; --line:#E4DAD1;
  --bg:#F6F0EA; --card:#FFFFFF; --card-2:#FBF6F1;
  --yellow:#FFC20E; --yellow-2:#FFE39A; --red:#D7263D;
  --brand-bg:#FFFFFF; --brand-fg:#D7263D; --top-bg:#D7263D; --top-fg:#FFFFFF;
  --zone-glow:#FFC20E; --zone-line:#1C1A1F; --ruled:#2A1C22; --ruled-op:.44; --ans-fill:#5E4A52; --hatch-op:.26;
  --shadow:4px 4px 0 var(--ink);
}
/* Jet Lag Night: the show's dark navy with the stripe as the accent. */
:root[data-theme="night"]{
  --ink:#F3F1EC; --ink-2:#C8C6D0; --ink-3:#8F93A3; --line:#2E3447;
  --bg:#10131D; --card:#191E2C; --card-2:#212737;
  --yellow:#FDB913; --yellow-2:#5A4300; --red:#E23B2E;
  --brand-bg:var(--stripe); --brand-fg:#10131D; --top-bg:#10131D; --top-fg:#F3F1EC;
  --zone-glow:#F58220; --zone-line:#FDB913; --ruled:#04050A; --ruled-op:.56; --ans-fill:#000; --hatch-op:.34;
  --shadow:4px 4px 0 #000;
}
/* Sunset: light, with orange doing the work yellow used to. */
:root[data-theme="sunset"]{
  --ink:#1D1B26; --ink-2:#4A4556; --ink-3:#827C8C; --line:#F0DCC4;
  --bg:#FFF6EA; --card:#FFFFFF; --card-2:#FFF0DC;
  --yellow:#F58220; --yellow-2:#FFD6AE; --red:#E23B2E;
  --brand-bg:var(--stripe); --brand-fg:#1D1B26; --top-bg:#1D1B26; --top-fg:#FFF6EA;
  --zone-glow:#F58220; --zone-line:#1D1B26; --ruled:#3A2716; --ruled-op:.42; --ans-fill:#6B5238; --hatch-op:.26;
  --shadow:4px 4px 0 var(--ink);
}
/* Classic: the app as it was. */
:root[data-theme="classic"]{ --top-bg:var(--bg); --top-fg:var(--ink); }
:root[data-theme="dark"]{
  --ink:#F2EFE6; --ink-2:#C9C5BA; --ink-3:#8E9299; --line:#3A3D44;
  --bg:#17181C; --card:#23252B; --card-2:#2B2E35; --yellow:#F5C400; --yellow-2:#5A4A00; --shadow:4px 4px 0 #000;
  --top-bg:#17181C; --top-fg:#F2EFE6; --ruled:#000; --ruled-op:.55;
}
*{box-sizing:border-box}
.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.themes button{display:flex;align-items:center;gap:8px;padding:8px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;text-align:left;font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.themes button.on{border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.themes .sw4{display:flex;width:44px;height:22px;flex:0 0 44px;border:1px solid rgba(0,0,0,.2)}
.themes .sw4 i{flex:1}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:'Barlow Condensed','Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
.app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;display:flex;align-items:center;gap:10px;padding:10px 16px 13px;background:var(--top-bg);color:var(--top-fg);border-bottom:0}
header.top::after{content:'';position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--stripe)}
header.top .brand{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px;text-transform:uppercase;background:var(--brand-bg);color:var(--brand-fg);padding:2px 8px;line-height:1.2}
header.top .sub{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--top-fg);opacity:.82;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);padding:2px 8px;font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase;font-size:13px;letter-spacing:.04em;background:var(--card);white-space:nowrap}
.pill.hider{background:var(--hider);color:#fff;border-color:var(--hider)}
.pill.seeker{background:var(--seeker);color:#fff;border-color:var(--seeker)}
main{flex:1;overflow:auto;padding:16px 16px calc(84px + env(safe-area-inset-bottom,0px))}
.card{background:var(--card);border:1.5px solid var(--ink);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px}
.card.flat{box-shadow:none}
.card h2{font-size:22px;margin-bottom:8px}
.card h3{font-size:14px;letter-spacing:.12em;color:var(--ink-3);margin:12px 0 6px}
.card h3:first-child{margin-top:0}
p{margin:6px 0}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:120px}
.btn{border:1.5px solid var(--ink);background:var(--card);padding:9px 14px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .05s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--yellow);color:#15171B}
.btn.danger{background:var(--red);color:#fff;border-color:var(--red)}
.btn.ghost{box-shadow:none;background:transparent}
.btn.sm{padding:5px 10px;font-size:14px;box-shadow:2px 2px 0 var(--ink)}
.btn.block{display:block;width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
input[type=text],select,textarea{width:100%;font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--ink);padding:9px 10px;border-radius:0}
select{appearance:auto}
label.f{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:8px 0 4px}
.seg{display:flex;border:1.5px solid var(--ink)}
.seg button{flex:1;border:0;background:var(--card);padding:8px 4px;font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase;font-size:15px;cursor:pointer;border-right:1.5px solid var(--ink)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--bg)}
.timer{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:52px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.timer.warn{color:var(--red)}
.phase{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;margin-top:10px}
.stat div{background:var(--card-2);padding:8px 10px;border-left:3px solid var(--yellow)}
.stat b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
/* question grid */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.cat{border:1.5px solid var(--ink);background:var(--card);padding:10px;cursor:pointer;text-align:left;box-shadow:3px 3px 0 var(--ink)}
.cat b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:18px;text-transform:uppercase}
.cat span{font-size:12px;color:var(--ink-3)}
.cat[disabled]{opacity:.4;cursor:not-allowed}
.qlist{display:flex;flex-direction:column;gap:6px}
.q{border:1.5px solid var(--line);background:var(--card);padding:9px 10px;cursor:pointer;text-align:left;display:flex;justify-content:space-between;gap:8px;align-items:center}
.q:hover,.q.on{border-color:var(--ink);background:var(--yellow-2)}
.q .fmt{font-size:12px;color:var(--ink-3)}
/* feed */
.msg{border:1.5px solid var(--ink);background:var(--card);padding:10px 12px;margin-bottom:10px;position:relative}
.msg.pending{border-color:var(--yellow);border-width:2.5px;background:var(--card)}
.msg .who{font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase;font-size:13px;letter-spacing:.06em;display:flex;justify-content:space-between;gap:8px}
.msg .who time{font-weight:600;color:var(--ink-3)}
.msg .txt{margin:4px 0;font-size:16px}
.msg .ans{margin-top:6px;padding:8px 10px;background:var(--card-2);border-left:4px solid var(--green)}
.msg .ans b{font-family:'Barlow Condensed',sans-serif;font-size:19px;text-transform:uppercase}
.msg .ans.veto{border-left-color:var(--red)}
.msg.curse{border-left:6px solid var(--hider)}
.bonus{margin-top:4px;font-size:14px;color:var(--ink-2)}
.bonus b{color:var(--ink)} .bonus span{color:var(--ink-3)}
.ctimers{display:grid;gap:6px;margin-top:10px}
.ct{display:flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:var(--card-2);padding:6px 8px;border-left:6px solid var(--yellow)}
.ct .ctl{flex:1;font-size:13px}
.ct .ctv{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px;letter-spacing:.02em}
.ct.over{border-left-color:var(--red);opacity:.75}
.ct .x{border:0;background:none;font-size:18px;cursor:pointer;color:var(--ink-3)}
.bcards{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.bcards button{border:1.5px solid var(--ink);padding:5px 9px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:800;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.pcard{border:1.5px solid var(--ink);background:var(--card);margin:10px 0;box-shadow:3px 3px 0 var(--ink)}
.pcard .pc-top{display:flex;justify-content:space-between;background:var(--top-bg);color:var(--top-fg);padding:5px 10px;font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:13px;border-bottom:4px solid transparent;border-image:var(--stripe) 1}
.pcard .pc-q{padding:9px 10px 2px;font-size:16px}
.pcard p{margin:6px 10px;font-size:14px;line-height:1.45}
.pcard details{margin:6px 10px 10px;font-size:13px;color:var(--ink-2)}
.pcard summary{cursor:pointer;font-weight:600}
details.curse{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;background:var(--card)}
details.curse>summary{cursor:pointer;font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:700;font-size:17px;letter-spacing:.01em;list-style:none}
details.curse>summary::-webkit-details-marker{display:none}
details.curse>summary::before{content:'\25B8';display:inline-block;width:1em;opacity:.55}
details.curse[open]>summary::before{content:'\25BE'}
details.curse .ct{margin:8px 0 0;line-height:1.45}
details.curse .cc{margin-top:8px;font-size:14px;opacity:.9}
details.curse .cn{margin-top:8px;font-size:13px;line-height:1.45;opacity:.75;border-top:1px dashed var(--line);padding-top:8px}
.hcard .cast{margin-left:auto;font-size:12px}
.mtext{white-space:pre-line}
.msg img{display:block;max-width:100%;margin-top:8px;border:1.5px solid var(--ink)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border:1px solid var(--ink-3);color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;margin-right:6px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.answers .btn{font-size:18px;padding:12px}
.answers .btn.sugg{outline:3px solid var(--green);outline-offset:2px}
.refbox{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--chip-bg,rgba(127,127,127,.12));font-size:14px;line-height:1.35}
.refbox b{font-weight:700}
.refbox.nul{border-left:4px solid var(--red)}
.refbox.ok{border-left:4px solid var(--green)}
.refbox select{margin-top:6px;width:100%}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;justify-content:center;background:var(--bg);border-top:1.5px solid var(--ink);padding:0 0 env(safe-area-inset-bottom,0px)}
nav.tabs .in{display:flex;width:100%;max-width:720px}
nav.tabs button{flex:1;border:0;background:transparent;padding:10px 4px 8px;font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase;font-size:14px;letter-spacing:.06em;cursor:pointer;color:var(--ink-3);position:relative}
nav.tabs button.on{color:var(--ink);box-shadow:inset 0 -4px 0 var(--yellow)}
nav.tabs button .n{position:absolute;top:6px;right:calc(50% - 26px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;padding:0 5px;font-family:'Barlow',sans-serif}
.hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.hcard{border:1.5px solid var(--ink);background:var(--card);padding:8px 10px;min-height:80px;display:flex;flex-direction:column;justify-content:space-between}
.hcard b{font-family:'Barlow Condensed',sans-serif;font-size:15px;text-transform:uppercase;line-height:1.1}
.hcard .x{align-self:flex-end;border:1px solid var(--ink-3);background:transparent;font-size:11px;padding:1px 6px;cursor:pointer;color:var(--ink-3)}
.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;font-weight:600;z-index:6;max-width:90vw;box-shadow:var(--shadow)}
/* map */
#mapview{flex:1;position:relative;overflow:hidden;background:#EDEAE1;touch-action:none;cursor:grab}
#mapleaf{position:absolute;inset:0;background:#EDEAE1;z-index:0}
/* Without Leaflet the drawing is a plain static SVG, which a positioned
   sibling would paint straight over. */
#mapview:not(.leaf) #mapleaf{display:none}
#mapleaf .leaflet-container{background:#EDEAE1;font-family:'Barlow',system-ui,sans-serif}
#mapleaf .leaflet-control-attribution{font-size:9px;background:rgba(255,255,255,.72)}
/* The drawing is a Leaflet layer once Leaflet is up, so Leaflet owns panning
   and the overlay must not swallow the gestures. Taps are resolved against
   the stop list by position instead. */
#mapview.leaf #mapsvg{position:absolute;width:auto;height:auto;pointer-events:none}
#mapview.leaf{cursor:default}
#mapview.drag{cursor:grabbing}
#mapsvg{width:100%;height:100%;display:block}
/* The drawing that scales with the map rides the compositor during a
   gesture; the markers that must stay one size on screen live in their own
   layer, re-placed every frame. */
#mapview.leaf #mapsvg{will-change:transform}
#mapfg{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.jlsvg .m-dot{fill:none;stroke-linecap:round;vector-effect:non-scaling-stroke}
.jlsvg .m-dot.o{stroke:#15171B}
.jlsvg .m-dot.i{stroke:#fff}
.jlsvg .m-dot.s{stroke:var(--yellow)}
.jlsvg .m-road{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.jlsvg .m-residential{stroke:#fff;stroke-width:.8px;opacity:.7}
.jlsvg .m-tertiary{stroke:#fff;stroke-width:1.1px;opacity:.9}
.jlsvg .m-secondary{stroke:#fff;stroke-width:2.1px}
.jlsvg .m-primary{stroke:#fff;stroke-width:2.9px}
.jlsvg .m-motorway{stroke:#B9B4A8;stroke-width:5px}
.jlsvg .m-rail{stroke:#8F8A80;stroke-width:1.4px;stroke-dasharray:6 4}
.jlsvg .m-cut{stroke:#15171B;stroke-width:9px;opacity:.13}
.jlsvg .m-bart{fill:none;stroke:#F7941D;stroke-width:5px;vector-effect:non-scaling-stroke}
.jlsvg .m-amtrak{fill:none;stroke:#1F3F8A;stroke-width:3px;vector-effect:non-scaling-stroke}
.jlsvg .m-zone{fill:none;stroke:var(--zone-line);stroke-width:3px;stroke-dasharray:13 7;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.jlsvg .m-zone-glow{fill:none;stroke:var(--zone-glow);stroke-width:8px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.jlsvg .m-oob{fill:#8C8A84;fill-opacity:.42;fill-rule:evenodd;pointer-events:none}
.jlsvg .m-stop{fill:#fff;stroke:#15171B;stroke-width:1.5px;vector-effect:non-scaling-stroke;cursor:pointer}
.jlsvg .m-stop.sel{fill:var(--yellow)}
.jlsvg .m-ruled{fill:var(--ruled);fill-opacity:var(--ruled-op);pointer-events:none}
.jlsvg .m-ansl{pointer-events:none;opacity:var(--hatch-op)}
.jlsvg .m-zonering{fill:none;stroke:#15171B;stroke-width:1px;stroke-dasharray:4 4;opacity:.35;vector-effect:non-scaling-stroke;pointer-events:none}
.jlsvg .m-con{fill:none;vector-effect:non-scaling-stroke;stroke-width:2px}
.jlsvg .m-con.in{stroke:#1F8A5B;stroke-dasharray:6 4}
.jlsvg .m-con.out{stroke:#D62828;stroke-dasharray:6 4}
.jlsvg .m-con.thermo{stroke:#E4572E;stroke-dasharray:9 6}
.jlsvg .m-leg{stroke:#E4572E;stroke-width:2px;vector-effect:non-scaling-stroke;opacity:.6}
.jlsvg .m-from{fill:#15171B;stroke:#fff;stroke-width:2px;vector-effect:non-scaling-stroke}
.jlsvg .m-label{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:11px;fill:#15171B;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;text-transform:uppercase;letter-spacing:.04em;pointer-events:none;text-anchor:middle}
.jlsvg .m-place{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:10px;fill:#3C4048;letter-spacing:.12em;text-transform:uppercase;paint-order:stroke;stroke:#EDEAE1;stroke-width:3px;pointer-events:none;text-anchor:middle}
.jlsvg .m-hz{fill:var(--hider);fill-opacity:.16;stroke:var(--hider);stroke-width:2.5px;vector-effect:non-scaling-stroke}
.jlsvg .m-me{fill:#1E88E5;stroke:#fff;stroke-width:3px;vector-effect:non-scaling-stroke}
.jlsvg .m-me-acc{fill:#1E88E5;fill-opacity:.15;stroke:none}
.jlsvg .m-pin{fill:var(--red);stroke:#fff;stroke-width:2px;vector-effect:non-scaling-stroke;cursor:pointer}
#mapctl{position:absolute;right:10px;z-index:401;bottom:calc(52px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
#mapctl button{width:40px;height:36px;border:1.5px solid var(--ink);background:var(--card);font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:15px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);padding:0}
#mapctl button.on{background:var(--yellow);color:#15171B}
#mapbar{position:absolute;left:10px;top:10px;right:60px;display:flex;flex-wrap:wrap;gap:6px;z-index:401}
#mapbar .chip{background:var(--card);opacity:.96}
#mapbar .chip.on{background:var(--ink);color:var(--card)}
#mappanel{position:absolute;right:10px;top:auto;bottom:calc(52px + env(safe-area-inset-bottom,0px));left:10px;max-height:46%;background:var(--card);border:1px solid var(--line);box-shadow:0 6px 22px rgba(0,0,0,.18);z-index:403;display:flex;flex-direction:column}
@media (min-width:620px){#mappanel{left:auto;top:46px;width:300px;max-height:none}}
#mappanel .ph{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);font-family:'Barlow Condensed',sans-serif;font-size:17px;letter-spacing:.02em}
#mappanel .ph b{flex:1}
#mappanel .ph button{border:1px solid var(--line);background:var(--card-2);font:inherit;font-size:12px;padding:2px 8px;cursor:pointer}

<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js"></script>

<script>
(function(){
// ---------- store ----------
// The companion needs one thing from a backend: a handful of small JSON
// documents that every player's phone sees. Three backends provide it, tried
// in order, all behind the same doc/collection API:
//
//   artifact  the claude.ai artifact runtime's db — private and durable
//   mqtt      a public MQTT broker over WebSockets, using retained messages
//             as the document store; no signup, works from static hosting
//   local     this device only, so the timers, cards, rules and map still
//             work when neither of the above is reachable
const Store=(function(){
const TOPIC='jlhs/v1/';
const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];
const mkid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);

// A document store over a path -> object map. `io` supplies persistence and
// delivery; everything else — queries, snapshots, change lists — is here.
function build(io){
  const cache=new Map(), listeners=[], pending=new Set();

  function snapDoc(path){ const d=cache.get(path);
    return {id:path.split('/').pop(),exists:d!==undefined,data:()=>d,
            metadata:{fromCache:false,hasPendingWrites:false}}; }
  function depth(p){ return p.split('/').length; }
  function isChild(base,path){ return path.startsWith(base+'/')&&depth(path)===depth(base)+1; }

  function colSnap(L){
    let ids=[...cache.keys()].filter(p=>isChild(L.path,p));
    const o=L.opts;
    if(o.order) ids.sort((a,b)=>{ const x=(cache.get(a)||{})[o.order], y=(cache.get(b)||{})[o.order];
      if(x===undefined) return 1; if(y===undefined) return -1;
      return (x<y?-1:x>y?1:0)*(o.dir==='desc'?-1:1); });
    else ids.sort();
    if(o.lim) ids=ids.slice(0,o.lim);
    const docs=ids.map(snapDoc);
    const prev=L.prev||[], now=docs.map(d=>d.id);
    const changes=[];
    docs.forEach((d,i)=>{ const j=prev.indexOf(d.id);
      if(j<0) changes.push({type:'added',doc:d,oldIndex:-1,newIndex:i});
      else if(L.seen[d.id]!==JSON.stringify(d.data())) changes.push({type:'modified',doc:d,oldIndex:j,newIndex:i}); });
    prev.forEach(id=>{ if(now.indexOf(id)<0) changes.push({type:'removed',doc:{id,exists:true,data:()=>undefined,metadata:{}},oldIndex:0,newIndex:-1}); });
    L.prev=now; L.seen={}; docs.forEach(d=>{ L.seen[d.id]=JSON.stringify(d.data()); });
    const local=docs.some(d=>pending.has(L.path+'/'+d.id));
    return {docs,size:docs.length,empty:!docs.length,docChanges:()=>changes,
            metadata:{fromCache:false,hasPendingWrites:local}};
  }

  // Called for every change, local or remote.
  function apply(path,value){
    if(value===null||value===undefined) cache.delete(path); else cache.set(path,value);
    const local=pending.delete(path);
    for(const L of listeners.slice()){
      if(L.kind==='doc'&&L.path===path){ const s=snapDoc(path); s.metadata.hasPendingWrites=local; L.fn(s); }
      else if(L.kind==='col'&&isChild(L.path,path)) L.fn(colSnap(L));
    }
  }
  io.attach(apply);

  function drop(L){ const i=listeners.indexOf(L); if(i>=0) listeners.splice(i,1); }

  function docRef(path){
    if(depth(path)%2) throw new TypeError('document paths have an even number of segments: '+path);
    return {
      id:path.split('/').pop(), path,
      get(){ io.watchDoc(path); return io.settle().then(()=>snapDoc(path)); },
      set(d){ pending.add(path); io.publish(path,d); return Promise.resolve(); },
      update(d){ pending.add(path); io.publish(path,Object.assign({},cache.get(path)||{},d)); return Promise.resolve(); },
      delete(){ pending.add(path); io.publish(path,null); return Promise.resolve(); },
      acquire(){ return Promise.resolve({acquired:true}); },
      onSnapshot(next){ io.watchDoc(path); const L={kind:'doc',path,fn:next};
        listeners.push(L); io.settle().then(()=>next(snapDoc(path))); return ()=>drop(L); },
      collection(sub){ return colRef(path+'/'+sub); }
    };
  }
  function colRef(base,opts){
    opts=opts||{order:null,dir:'asc',lim:0};
    const q={
      path:base,
      orderBy(f,d){ return colRef(base,Object.assign({},opts,{order:f,dir:d||'asc'})); },
      limit(n){ return colRef(base,Object.assign({},opts,{lim:n})); },
      where(){ return q; },
      get(){ io.watchCollection(base); const L={kind:'col',path:base,opts,prev:[],seen:{}};
             return io.settle().then(()=>colSnap(L)); },
      onSnapshot(next){ io.watchCollection(base);
        const L={kind:'col',path:base,opts,prev:[],seen:{},fn:next};
        listeners.push(L); io.settle().then(()=>next(colSnap(L))); return ()=>drop(L); },
      add(d){ const id=mkid(); const p=base+'/'+id; pending.add(p); io.publish(p,d); return Promise.resolve({id}); },
      doc(id){ return docRef(base+'/'+(id||mkid())); }
    };
    return q;
  }
  return {doc:docRef, collection:colRef};
}

// --- MQTT: one retained message per document -----------------------------
function mqttIO(client){
  const subs=new Set(); let apply=null;
  client.on('message',(topic,payload)=>{
    if(!apply||topic.indexOf(TOPIC)!==0) return;
    let v=null;
    if(payload&&payload.length){ try{ v=JSON.parse(payload.toString()); }catch(e){ return; } }
    apply(topic.slice(TOPIC.length),v);
  });
  const sub=t=>{ if(!subs.has(t)){ subs.add(t); client.subscribe(t,{qos:0}); } };
  return {
    attach(fn){ apply=fn; },
    // Retained messages arrive right after SUBSCRIBE; a short grace period
    // lets the first batch land before the first snapshot goes out.
    settle(){ return new Promise(r=>setTimeout(r,400)); },
    publish(path,value){ client.publish(TOPIC+path, value===null?'':JSON.stringify(value), {retain:true,qos:0}); },
    watchDoc(path){ sub(TOPIC+path); },
    watchCollection(base){ sub(TOPIC+base+'/+'); }
  };
}

// --- local: this device only ---------------------------------------------
function localIO(){
  const KEY='hs-local-db'; let data={}, apply=null;
  try{ data=JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){}
  const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(data)); }catch(e){} };
  return {
    attach(fn){ apply=fn; for(const k in data) fn(k,data[k]); },
    settle(){ return Promise.resolve(); },
    publish(path,value){ if(value===null) delete data[path]; else data[path]=value; save(); apply(path,value); },
    watchDoc(){}, watchCollection(){}
  };
}

function connectMqtt(){
  return new Promise(resolve=>{
    if(!window.mqtt){ resolve(null); return; }
    let i=0;
    const tryNext=()=>{
      if(i>=BROKERS.length){ resolve(null); return; }
      const url=BROKERS[i++];
      let done=false;
      const c=mqtt.connect(url,{clientId:'hs_'+mkid(),clean:true,connectTimeout:6000,reconnectPeriod:3000,keepalive:30});
      const fail=()=>{ if(done) return; done=true; try{c.end(true);}catch(e){} tryNext(); };
      const timer=setTimeout(fail,7000);
      c.on('connect',()=>{ if(done) return; done=true; clearTimeout(timer); c.__url=url; resolve(c); });
      c.on('error',fail);
    };
    tryNext();
  });
}

return { async open(){
  if(window.claude&&claude.use){
    try{ const d=await claude.use('db'); if(d) return {kind:'artifact',db:d}; }catch(e){}
  }
  const c=await connectMqtt();
  if(c) return {kind:'mqtt',db:build(mqttIO(c)),detail:c.__url.split('/')[2]};
  return {kind:'local',db:build(localIO())};
}};
})();

// ---------- rules data ----------

 {k:'cairn',n:'Cairn',

  c:'Build a rock tower.',
  d:'You cannot begin fulfilling the casting cost of this curse if you would be otherwise unable to play a curse; once the cost is fulfilled, this curse must be cast immediately. “Found in nature,” in this context, does not necessarily mean found in a natural space or untouched by humans; it simply means that you must find the rocks yourself, and cannot buy them.'},

  unsubs.push(ref.onSnapshot(s=>{ if(!s.exists){ toast('Game was deleted'); leave(); return; } const prev=game; game=s.data(); onGame(prev); render(); }, e=>toast('Lost connection to game')));
  unsubs.push(ref.collection('questions').orderBy('askedAt','asc').limit(400).onSnapshot(s=>{ const prev=questions; questions=s.docs.map(d=>({id:d.id,...d.data()})); onQuestions(prev,s); render(); }, e=>console.warn(e)));
  unsubs.push(ref.collection('messages').orderBy('at','asc').limit(200).onSnapshot(s=>{ const prev=messages; messages=s.docs.map(d=>({id:d.id,...d.data()})); onMessages(prev,s); render(); }, e=>console.warn(e)));
  unsubs.push(ref.collection('crossed').limit(900).onSnapshot(s=>{ const c={};
    for(const d of s.docs){ const v=d.data(); if(v&&v.out) c[d.id]=1; }
    crossed=c; Map3.syncPins(); render(); }, e=>console.warn(e)));
  unsubs.push(ref.collection('photos').limit(40).onSnapshot(s=>{ let n=0;
    for(const d of s.docs){ if(!photos[d.id]) n++; photos[d.id]=(d.data()||{}).d; }
    if(n) render(); }, e=>console.warn(e)));
  unsubs.push(ref.collection('pins').orderBy('at','asc').limit(100).onSnapshot(s=>{ pins=s.docs.map(d=>({id:d.id,...d.data()})); Map3.syncPins(); }, e=>console.warn(e)));
  // register player
  if(me.name){ const g=snap.data(); const players=Object.assign({},g.players||{}); if(!players[me.name]||players[me.name]!==me.role){ players[me.name]=me.role; await ref.update({players}); } }
  $('#tabs').hidden=false;
}
function onGame(prev){
  if(prev && prev.phase!==game.phase){ if(game.phase==='seeking') toast(isHider()?'Seekers are on the move.':'Seeking has started — ask away.'); if(game.phase==='endgame') toast('Endgame: seekers are in the zone.'); if(game.phase==='found') toast('Hider found! Round over.'); beep(); }
}
function onQuestions(prev,snap){
  const ch=snap.docChanges().filter(c=>!snap.metadata.hasPendingWrites);
  for(const c of ch){ const d=c.doc.data(); if(c.type==='added'&&d.status==='pending'&&isHider()){ beep(); toast('New question from '+d.askedBy); } if(c.type==='modified'&&d.status!=='pending'&&!isHider()&&d.askedBy!==me.name){ beep(); } if(c.type==='modified'&&d.status!=='pending'&&!isHider()&&d.askedBy===me.name){ beep(); toast('Hider answered: '+(d.answer||d.status)); } }
}
function onMessages(prev,snap){
  const ch=snap.docChanges().filter(c=>!snap.metadata.hasPendingWrites);
  for(const c of ch){ const d=c.doc.data(); if(c.type==='added'&&d.from!==me.name){ beep(); toast((d.kind==='curse'?'Curse cast: ':'')+d.title); } }
}

async function createGame(name,size){

  const g={name:name||('Game '+c),size,zone:DEFAULT_ZONE,phase:'setup',createdAt:Date.now(),hider:me.role==='hider'?me.name:'',players:{[me.name]:me.role},hidingStartAt:null,seekingStartAt:null,endgameAt:null,foundAt:null,hand:[],note:'',strict:false};
  await db.doc('games/'+c).set(g); join(c);
}
async function patch(data){ if(!code) return; try{ await db.doc('games/'+code).update(data); }catch(e){ toast('Could not save: '+(e.code||e.message)); } }
async function sendQuestion(){
  const cat=CATS.find(c=>c.id===askState.cat); if(!cat||askState.q==null) return;
  const q=cat.qs[askState.q];
  let text=q[0], distM=q[2]||null;
  if(q[1]==='custom'){
    distM=parseDist(askState.custom);
    if(!distM){ toast('Type a distance like "2 miles" or "800 m"'); return; }
    text=fmtDist(distM);
  }
  if(cat.loc&&!askState.loc){ toast('Set where you are first'); return; }
  // Asking the same question again costs the additional cost: the hider
  // draws that multiple of cards.
  const mult=multOf(cat.id,text);
  if(mult>1&&!confirm('That question has been asked '+(mult-1)+(mult===2?' time':' times')+' already, so it costs '+MULT_WORD[mult]+': the hider draws '+(cat.draw*mult)+' and keeps '+(cat.keep*mult)+'.\n\nAsk it anyway?')) return;
  // Which reference points this question is about, so every phone narrows
  // the map the same way without re-deriving it from the wording.
  const info=(cat.id==='radar'||cat.id==='thermo'||cat.id==='photo')?{}:Map3.qInfo(cat.id,text);
  const ref=info.ref||null;
  if(ref==='#line'&&!askState.line){ toast('Pick the line you are riding'); return; }
  // The seeker's own side travels with the question, so the hider (and
  // everyone reading the feed later) sees exactly what was compared.
  let mine=null;
  if(ref&&askState.loc&&!info.nul&&!info.always){
    const r=Map3.sideAt(cat.id,text,askState.loc,{distM,line:askState.line,stn:askState.stn});
    if(r&&!r.nul&&!r.always){ mine={txt:r.txt};
      for(const k of ['n','d','du','v','id']) if(r[k]!=null) mine[k]=r[k];
      if(r.list) mine.list=r.list.map(o=>({n:o.n,d:Math.round(o.d)})); }
  }
  const body={cat:cat.id,catName:cat.name,fmt:cat.fmt,q:text,askedBy:me.name,askedAt:Date.now(),
    status:cat.two?'started':'pending',answer:'',answeredAt:null,photo:'',note:'',
    draw:cat.draw*mult,keep:cat.keep*mult,mult:mult,ans:cat.ans,ref:ref,mine:mine,line:ref==='#line'?askState.line:null,
    loc:askState.loc||null,locHow:askState.locHow||'',loc2:null,distM:distM};
  try{
    await db.doc('games/'+code).collection('questions').add(body);
    askState={cat:null,q:null,custom:'',loc:null,locHow:'',line:null,stn:null};
    toast(cat.two?'Thermometer started — the hider has your starting point':'Sent to the hider');
    // Stay on Ask for a thermometer: the running card there is how you
    // finish it once you have travelled.
    tab=cat.two?'ask':'feed'; save('hs-tab',tab); render();
  }catch(e){ toast('Send failed: '+(e.code||e.message)); }
}
// Second leg of a thermometer: you have travelled, now the question goes out.
async function finishThermo(){
  const q=questions.find(x=>x.id===thermoFinish.qid);
  if(!q||!thermoFinish.loc) return;
  const gone=Map3.trueMetres(q.loc,thermoFinish.loc);
  if(gone<q.distM){
    toast(`Only ${fmtDist(gone)} from your start — you need ${fmtDist(q.distM)} as the crow flies`);
    return;
  }
  try{
    await db.doc('games/'+code+'/questions/'+q.id).update({status:'pending',loc2:thermoFinish.loc,travelled:Math.round(gone)});
    thermoFinish={qid:null,loc:null,how:''};
    toast('Asked — the hider can answer now'); tab='feed'; save('hs-tab',tab); render();
  }catch(e){ toast('Could not send: '+(e.code||e.message)); }
}
async function answerQ(id,answer,extra){
  try{ await db.doc('games/'+code+'/questions/'+id).update(Object.assign({status:'answered',answer,answeredAt:Date.now()},extra||{})); }catch(e){ toast('Could not answer: '+(e.code||e.message)); }
}
async function vetoQ(id){ try{ await db.doc('games/'+code+'/questions/'+id).update({status:'vetoed',answer:'Vetoed',answeredAt:Date.now()}); }catch(e){ toast('Could not veto'); } }
async function sendMessage(kind,title,text,extra){ try{ await db.doc('games/'+code).collection('messages').add(Object.assign({kind,title,text,from:me.name,role:me.role,at:Date.now()},extra||{})); }catch(e){ toast('Send failed'); } }
// A photo has to cross a public MQTT broker, which takes small messages and
// nothing else, so it is re-encoded down to something that fits rather than
// being sent as the multi-megabyte file the camera produced. The artifact
// runtime has a real asset store, and is used instead when it is there.
const PHOTO_MAX_PX=1280, PHOTO_BUDGET=110*1024;
function shrink(file){
  return new Promise((resolve,reject)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      let w=img.naturalWidth, h=img.naturalHeight;
      const k=Math.min(1,PHOTO_MAX_PX/Math.max(w,h));
      w=Math.round(w*k); h=Math.round(h*k);
      const cv=document.createElement('canvas');
      const draw=(cw,ch)=>{ cv.width=cw; cv.height=ch;
        cv.getContext('2d').drawImage(img,0,0,cw,ch); };
      draw(w,h);
      // Step the quality down, then the size, until it fits the budget.
      let out=cv.toDataURL('image/jpeg',0.82);
      for(const q of [0.7,0.6,0.5,0.4]){ if(out.length<=PHOTO_BUDGET*1.37) break;
        out=cv.toDataURL('image/jpeg',q); }
      let guard=0;
      while(out.length>PHOTO_BUDGET*1.37&&guard++<4){
        w=Math.round(w*0.75); h=Math.round(h*0.75); draw(w,h);
        out=cv.toDataURL('image/jpeg',0.6);
      }
      resolve({url:out,w,h});
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('That file is not an image')); };
    img.src=url;
  });
}
async function uploadPhoto(file,qid){
  try{
    toast('Preparing photo…');
    if(assets){ const r=await assets.upload(file); await answerQ(qid,'Photo sent',{photo:r.id}); toast('Sent'); return; }
    const {url,w,h}=await shrink(file);
    await db.doc('games/'+code+'/photos/'+qid).set({d:url,at:Date.now()});
    photos[qid]=url;
    await answerQ(qid,'Photo sent',{photoDoc:qid,photoW:w,photoH:h});
    toast('Sent');
  }catch(e){ toast('Could not send the photo: '+(e.message||e.code||'unknown')); }
}

function render(){
  const m=$('#main');
  $('#hdr-role').textContent=me.name?(me.name+' · '+me.role):'—';

  if(!db){ $('#hdr-sub').textContent='Offline'; m.innerHTML='<div class="card"><h2>No store available</h2><p>The companion could not reach any way to share a game between phones, and local storage is unavailable too.</p></div>'+rulesCard(); return; }
  if(!game){ $('#hdr-sub').textContent='Lobby'; $('#tabs').hidden=true; m.innerHTML=lobby(); wire(); return; }
  $('#hdr-sub').textContent=game.name+' · '+code;

  const mv=$('#mapview');

  }
  if(!tick) tick=setInterval(()=>{ const t=$('#timer'); if(t) t.textContent=timerText(); const t2=$('#timer2'); if(t2) t2.textContent=timerText2(); tickTimers(); },1000);
}

}

  return `<div class="card flat"><h3>Sync</h3><p class="small"><b>This device only.</b> No broker was reachable, so a game you start here will not appear on anyone else's phone. The timers, cards, rules and map still work.</p></div>`;

function rulesCard(){

function timerText(){
  const now=Date.now();
  if(game.phase==='hiding'){ const end=game.hidingStartAt+SIZES[game.size].hide*60000; return fmtT(end-now); }
  if(game.phase==='seeking'||game.phase==='endgame') return fmtT(now-game.seekingStartAt);
  if(game.phase==='found') return fmtT(game.foundAt-game.seekingStartAt);
  return '--:--';
}
function timerText2(){ if(game.phase==='endgame') return fmtT(Date.now()-game.endgameAt); return ''; }
function statusCard(){
  const S=SIZES[game.size]||SIZES.S;
  const label={setup:'Setup',hiding:'Hiding period — seekers wait',seeking:'Seeking — hider time running',endgame:'Endgame — seekers in the zone',found:'Round over'}[game.phase];
  let ctl='';
  if(game.phase==='setup') ctl=`<button class="btn primary" id="btn-start-hiding">Start hiding period</button>`;
  else if(game.phase==='hiding') ctl=`<button class="btn" id="btn-start-seeking">Hiding period over — release seekers</button>`;
  else if(game.phase==='seeking') ctl=`<button class="btn" id="btn-endgame">We're in the hiding zone</button> <button class="btn danger" id="btn-found">Found!</button>`;
  else if(game.phase==='endgame') ctl=`<button class="btn danger" id="btn-found">Found!</button>`;
  else ctl=`<button class="btn" id="btn-leave">Back to lobby</button>`;
  const warn=game.phase==='hiding'&&(game.hidingStartAt+S.hide*60000-Date.now())<120000;
  return `<div class="card"><div class="phase">${label}</div>
    <div class="row" style="align-items:flex-end"><div class="timer ${warn?'warn':''}" id="timer">${timerText()}</div>${game.phase==='endgame'?`<div class="muted small">endgame <span id="timer2">${timerText2()}</span></div>`:''}</div>
    ${bonusLine()}${timersHtml()}
    <div class="stat"><div><b>${esc(game.hider||'?')}</b><span>hider</span></div><div><b>${S.name}</b><span>${S.zone} zone</span></div>${isHider()?`<div><b>${(game.hand||[]).length}</b><span>cards in hand</span></div>`:''}<div><b>${questions.length}</b><span>questions</span></div>${narrowChip()}</div>
    <div class="row" style="margin-top:12px">${ctl}</div></div>`;
}
// Shared "where are you" control. `which` is 'ask' or 'finish'.
function locRow(which,loc,how){
  return `<label class="f">Your location ${loc?`<span style="color:var(--green)">· set${how?' by '+esc(how):''}</span>`:'<span style="color:var(--red)">· needed</span>'}</label>
    <div class="row"><button class="btn sm" data-gps="${which}">Use GPS</button><button class="btn sm" data-pick="${which}">Pick on map</button></div>`;
}
function runningThermos(){
  const mine=questions.filter(q=>q.cat==='thermo'&&q.status==='started'&&q.askedBy===me.name);
  if(!mine.length) return '';
  return mine.map(q=>{
    const armed=thermoFinish.qid===q.id;
    const gone=armed&&thermoFinish.loc?Map3.trueMetres(q.loc,thermoFinish.loc):null;
    return `<div class="card" style="border-width:2.5px;border-color:var(--yellow)">
      <h2>Thermometer running</h2>
      <p class="small">The hider has your starting point. Travel <b>${fmtDist(q.distM)}</b> as the crow flies, then ask.</p>
      ${armed?locRow('finish',thermoFinish.loc,thermoFinish.how):`<button class="btn block" data-arm="${q.id}" style="margin-top:8px">I've travelled — set my new spot</button>`}
      ${gone!==null?`<p class="small ${gone>=q.distM?'':'muted'}">${fmtDist(gone)} from the start${gone>=q.distM?' — far enough':` — ${fmtDist(q.distM-gone)} to go`}</p>`:''}
      ${armed?`<button class="btn primary block" id="btn-thermo-go" style="margin-top:8px" ${thermoFinish.loc?'':'disabled'}>Ask: am I hotter or colder?</button>`:''}
    </div>`;
  }).join('');
}
function ask(){
  if(game.phase!=='seeking'&&game.phase!=='endgame') return `<div class="notice">Questions open once the hiding period ends${game.phase==='setup'?' — start it from the card above.':'.'}</div>`;
  const running=runningThermos();
  const cat=CATS.find(c=>c.id===askState.cat);
  if(!cat) return running+`<div class="card"><h2>Ask the hider</h2><p class="small muted">Pick a category. Each question you send makes the hider draw cards — the draw/keep counts are shown.</p>
    <div class="cats">${CATS.map(c=>`<button class="cat" data-cat="${c.id}" ${sizeOk(c.min)?'':'disabled'}><b>${c.name}</b><span>${sizeOk(c.min)?`draw ${c.draw} · keep ${c.keep}`:'medium+ games only'}</span></button>`).join('')}</div></div>`;
  const sel=cat.qs[askState.q];
  const needLoc=!!cat.loc;
  return running+`<div class="card"><div class="row"><button class="btn sm ghost" id="btn-back">‹ Categories</button><h2 style="flex:1">${cat.name}</h2></div><p class="small muted">${esc(cat.fmt)}</p>
    ${cat.two?`<p class="small">Starting one sends the hider your position now. You then travel the distance and ask from where you end up.</p>`:''}
    <div class="qlist">${cat.qs.map((q,i)=>{ const ok=q[1]==='custom'||sizeOk(q[1]); if(!ok) return '';
      const inf=(cat.id==='matching'||cat.id==='measuring'||cat.id==='tentacle')?Map3.qInfo(cat.id,q[0]):{};
      const tag=q[1]==='custom'?'custom':(inf.nul?'null here':inf.always?'always yes':'');
      const mu=q[1]==='custom'?1:multOf(cat.id,q[0]);
      const mtag=mu>1?`<span class="fmt" style="color:var(--hider)">${MULT_WORD[mu]} cost</span>`:'';
      return `<button class="q ${askState.q===i?'on':''}" data-q="${i}"><span>${esc(q[0])}</span>${mtag}<span class="fmt">${tag}</span></button>`; }).join('')}</div>
    ${sel&&sel[1]==='custom'?`<label class="f" for="ask-custom">Distance</label><input type="text" id="ask-custom" value="${esc(askState.custom)}" placeholder="e.g. 2 miles">`:''}
    ${cat.id==='photo'&&sel?photoCard(sel[0],false):''}
    ${needLoc?locRow('ask',askState.loc,askState.locHow):''}
    ${sel?refBox(cat,sel):''}
    <button class="btn primary block" id="btn-send" style="margin-top:12px" ${askState.q==null||(needLoc&&!askState.loc)||(sel&&cat.id==='matching'&&REF[sel[0]]==='#line'&&!askState.line)?'disabled':''}>${cat.two?'Start thermometer':'Send to hider'}</button></div>`;
}
// The seeker's own side of the selected question, shown before it is sent.
const SIDE_LABEL={matching:'Your nearest',measuring:'Yours',tentacle:'In reach of you'};
function refBox(cat,sel){
  if(cat.id==='radar'||cat.id==='thermo'||cat.id==='photo') return '';
  const text=sel[0], info=Map3.qInfo(cat.id,text);
  if(info.nul) return `<div class="refbox nul"><b>Null here.</b> ${esc(info.nul)} You can still ask it — it counts, and the hider still draws.</div>`;
  if(info.always) return `<div class="refbox nul"><b>Always yes here.</b> ${esc(info.always)} It can't narrow anything.</div>`;
  if(!askState.loc) return `<div class="refbox">Set your location to see ${cat.id==='matching'?'your nearest '+esc(text.toLowerCase()):'your side of this'}.</div>`;
  const r=Map3.sideAt(cat.id,text,askState.loc,{distM:sel[2],line:askState.line,stn:askState.stn});
  if(!r) return '';
  if(r.nul) return `<div class="refbox nul">${esc(r.nul)}</div>`;

  if(info.ref==='#namelen') return `<div class="refbox ok"><b>Your station:</b> ${esc(r.txt)}<select id="ask-stn">${r.options.map(o=>`<option value="${o.i}" ${o.i===r.id?'selected':''}>${esc(o.n)} — ${o.n.length} ch · ${fmtDist(o.d)}</option>`).join('')}</select><div class="small muted" style="margin-top:6px">Spaces and hyphens count. Yes means their hiding station's name is the same length.</div></div>`;
  const lab=info.ref==='#sea'?'Your elevation':info.ref==='#water'?'Your nearest body of water':info.ref==='@countyline'?'Your distance':info.ref==='#street'?'Your nearest street or path':info.ref&&info.ref[0]==='!'?'You are in':(cat.id==='measuring'?'Your nearest':SIDE_LABEL[cat.id]);
  if(cat.id==='tentacle'&&r.list&&!r.list.length) return `<div class="refbox nul"><b>${esc(lab)}:</b> ${esc(r.txt)}. With nothing to name, the hider can only tell you whether they're within ${fmtDist(sel[2])} of you.</div>`;
  return `<div class="refbox ok"><b>${esc(lab)}:</b> ${esc(r.txt)}</div>`;
}

// Works out the hider's answer from where they are — their hiding station
// by default, or GPS / a tap on the map for where they actually stand.
function hiderHelp(q){
  if(q.cat==='photo') return {html:''};
  const hz=Map3.hideStop();
  const at=hiderAt||(hz?{loc:[hz.x,hz.y],how:'your hiding station ('+hz.n+')'}:null);
  const s=Map3.suggest(q,at&&at.loc,hz);
  const where=`<div class="row" style="margin-top:6px;gap:6px"><button class="btn sm" data-gps="hider">Use my GPS</button><button class="btn sm" data-pick="hider">Pick on map</button>${hiderAt&&hz?`<button class="btn sm" data-hstn="1">Use my station</button>`:''}</div>`;
  let h=`<div class="refbox ${s&&s.ans?'ok':''}"><b>Your side</b>${at?` <span class="small muted">— from ${esc(at.how)}</span>`:''}<br>`;
  if(!at&&!(s&&s.why)) h+=`Set your hiding station on the map, or use GPS, and the app works out your answer.`;
  else if(s){ h+=esc(s.why||''); if(s.ans) h+=`<br>Answer: <b>${esc(q.ref==='#metro'?Map3.lineName(s.ans):s.ans)}</b>`; }
  h+=where+`<div class="small muted" style="margin-top:4px">Your position never leaves this phone.</div></div>`;
  return {html:h,ans:s&&s.ans};
}
// The question as a sentence: both blanks of a matching card are the same
// thing; a tentacle card's two blanks are its distance and its kind.
function qSentence(q){
  const m=q.cat==='tentacle'&&String(q.q).match(/^(.*) within (.*)$/);
  if(m) return 'Within <b>'+esc(m[2])+'</b> of me, which of the <b>'+esc(m[1].toLowerCase())+'</b> are you nearest to?';
  const SPECIAL={'Transit line':'Does the <b>line I’m riding</b> stop at your station?',
    'Station name length (characters)':'Is your station’s name the <b>same length</b> as mine?',
    'Street or path':'Is your nearest <b>street or path</b> the same as mine?',
    'Landmass':'Are you on the same <b>landmass</b> as me?'};
  if(q.cat==='matching'&&SPECIAL[q.q]) return SPECIAL[q.q];
  const adm=q.cat==='matching'&&String(q.q).match(/administrative division \((\w+)\)$/);
  if(adm) return 'Are you in the same <b>'+esc(adm[1])+'</b> as me?';
  return esc(q.fmt).replace(/___/g,'<b>'+esc(q.q)+'</b>');
}
const photoSrc=q=>q.photo?'/_blob/'+q.photo:(q.photoDoc?photos[q.photoDoc]:null);
function qCard(q,mine){
  const pending=q.status==='pending';

  if(q.loc) body+=`<div class="small muted">From ${esc(Map3.near(q.loc))}${q.loc2?` to ${esc(Map3.near(q.loc2))}${q.travelled?` · ${fmtDist(q.travelled)} apart`:''}`:''}</div>`;
  if(q.line) body+=`<div class="small">Riding: <b>${esc(Map3.lineName(q.line))}</b></div>`;
  else if(q.mine&&q.mine.txt) body+=`<div class="small">Theirs: <b>${esc(q.mine.txt)}</b></div>`;
  if(started){ body+=`<p class="small muted">${mine?'Waiting for them to travel and ask.':'Travel the distance, then ask from the Ask tab.'}</p>`; return body+'</div>'; }
  // Everyone can see what the photo has to show; the hider gets it open below.
  if(q.cat==='photo'&&!(pending&&mine)&&PHOTO_SPEC[q.q]) body+=`<details class="small" style="margin-top:6px"><summary>Show the card</summary>${photoCard(q.q,false)}</details>`;
  if(pending&&mine){
    body+=`<p class="small muted">Draw ${q.draw}, keep ${q.keep} — answer first, then log the card you kept in Hand.</p>`;
    const hs=hiderHelp(q);
    body+=hs.html;
    if(q.ans&&q.ans.length) body+=`<div class="answers">${q.ans.map(a=>`<button class="btn primary ${hs.ans===a?'sugg':''}" data-ans="${esc(a)}" data-qid="${q.id}">${esc(a)}</button>`).join('')}</div>`;
    else if(q.cat==='photo') body+=`${photoCard(q.q,true)}<div class="row" style="margin-top:8px"><label class="btn primary" style="display:inline-block">Take / choose photo<input type="file" accept="image/*" capture="environment" data-photo="${q.id}" hidden></label><button class="btn" data-ans="${CANNOT_PHOTO}" data-qid="${q.id}">${CANNOT_PHOTO}</button></div>
      <div class="row" style="margin-top:6px"><button class="btn sm ghost" data-textans="${q.id}">Camera not working? Describe it instead</button></div>
      <div class="row" id="ta-row-${q.id}" hidden style="margin-top:8px"><input type="text" class="grow" id="ta-${q.id}" placeholder="Describe what the photo would show"><button class="btn primary" data-sendtext="${q.id}">Answer</button></div>
      <p class="small muted">Photo time limit: ${SIZES[game.size].photo} min.</p>`;
    else { const opts=q.cat==='tentacle'?Map3.tentacleOptions(q):[];
      if(opts.length) body+=`<div class="answers">${opts.map(o=>`<button class="btn primary ${hs.ans===o?'sugg':''}" data-ans="${esc(o)}" data-qid="${q.id}">${esc(q.ref==='#metro'?Map3.lineName(o):o)}</button>`).join('')}<button class="btn ${hs.ans===NOT_IN_REACH?'sugg':''}" data-ans="${NOT_IN_REACH}" data-qid="${q.id}">${NOT_IN_REACH}</button></div><p class="small muted">The ones within range of where they asked, nearest to them first. You have to be inside that range yourself — if you are not, say so.</p>`;
      else if(q.cat==='tentacle') body+=`<div class="answers"><button class="btn ${hs.ans===IN_REACH_NONE?'sugg':''}" data-ans="${IN_REACH_NONE}" data-qid="${q.id}">${IN_REACH_NONE}</button><button class="btn ${hs.ans===NOT_IN_REACH?'sugg':''}" data-ans="${NOT_IN_REACH}" data-qid="${q.id}">${NOT_IN_REACH}</button></div><p class="small muted">Nothing of that kind is within reach of where they asked, so there's nothing to name — only whether you're in reach.</p>`;
      body+=`<div class="row" style="margin-top:8px"><input type="text" class="grow" id="ta-${q.id}" placeholder="${opts.length?'Something else':'Your answer'}"><button class="btn primary" data-sendtext="${q.id}">Answer</button></div>`; }
    body+=`<div class="row" style="margin-top:8px"><button class="btn sm" data-veto="${q.id}">Veto (uses a Veto card)</button></div>`;
  } else if(pending){ body+=`<p class="small muted">Waiting for the hider…</p>`; }
  else { const cut=Map3.cutBy(q);
    body+=`<div class="ans ${q.status==='vetoed'?'veto':''}"><b>${esc(q.answer)}</b>${q.note?' — '+esc(q.note):''}<span class="small muted"> · ${fmtClock(q.answeredAt)}</span>${cut?`<div class="small" style="opacity:.85;margin-top:4px">${esc(cut)}</div>`:''}${photoSrc(q)?`<img src="${photoSrc(q)}" alt="Photo answer">`:(q.photoDoc?`<div class="small muted">Photo on its way\u2026</div>`:'')}</div>`; }
  return body+'</div>';
}
function feed(){
  const items=[...questions.map(q=>({t:q.askedAt,k:'q',q})),...messages.map(m=>({t:m.at,k:'m',m}))].sort((a,b)=>b.t-a.t);
  if(!items.length) return `<div class="card"><h2>Feed</h2><p class="muted">Every question, answer, curse and note shows up here, newest first, on every phone.</p></div>`;
  return items.map(it=> it.k==='q'? qCard(it.q,isHider()) : `<div class="msg ${it.m.kind}"><div class="who"><span><span class="tag">${esc(it.m.kind)}</span>${esc(it.m.from)}</span><time>${fmtClock(it.m.at)}</time></div><div class="txt"><b>${esc(it.m.title)}</b></div>${it.m.text?`<div class="mtext">${esc(it.m.text)}</div>`:''}${curseActs(it.m)}</div>`).join('');
}
// The rulebook: a question that has been asked can only be asked again for
// its additional cost. A veto still counts as having been asked; a randomize
// does not. Second ask doubles, third triples, fourth quadruples.
const MULT_WORD=['','','double','triple','quadruple'];
function askedBefore(catId,text){ return questions.filter(q=>q.cat===catId&&q.q===text&&q.status!=='randomized').length; }
function multOf(catId,text){ return Math.min(askedBefore(catId,text)+1,4); }
function handLimit(){ return (game&&game.handMax)||6; }
function curseActs(m){
  const k=m.curse; if(!k) return '';

  if(t&&!t.auto) h+=`<button class="btn sm" data-start-timer="${k}">Start the ${minsOf(t.m)}-minute timer</button>`;
  if(CURSE_AWARD[k]&&isHider()){ const done=(game.awards||[]).some(a=>a.msg===m.id);
    h+=done?`<span class="small muted">+${minsOf(CURSE_AWARD[k])} min banked</span>`
      :`<button class="btn sm" data-award="${k}|${m.id}">They broke it — bank +${minsOf(CURSE_AWARD[k])} min</button>`; }
  return h?`<div class="row" style="margin-top:8px;gap:8px;flex-wrap:wrap">${h}</div>`:'';
}
function hand(){

    <div class="hand">${h.map(c=>`<div class="hcard"${c.bonus?` style="border-left:6px solid ${BONUS_HEX[c.bonus]}"`:''}><b>${esc(c.kind)}</b><span class="small">${c.bonus?'+'+bonusCardMins(c)+' min':esc(c.text)}</span>${c.curse?`<button class="btn sm cast" data-cast="${esc(c.id)}">cast</button>`:''}<button class="x" data-discard="${esc(c.id)}">discard</button></div>`).join('')}</div>

// ---------- wiring ----------
function wire(){
  // Each element is bound once per selector and event. Most of what this
  // wires is rebuilt on every render, but the tab bar is not: binding it
  // again on each render stacked one more render onto every tap, so taps
  // got exponentially slower as a round went on.
  const on=(sel,ev,fn)=>document.querySelectorAll(sel).forEach(el=>{ const k='__on '+ev+' '+sel;
    if(el[k]) return; el[k]=1; el.addEventListener(ev,fn); });
  on('#me-name','input',e=>{ me.name=e.target.value.trim(); save('hs-me',me); });
  on('[data-role]','click',e=>{ me.role=e.currentTarget.dataset.role; save('hs-me',me); render(); });
  on('#new-size button','click',e=>{ document.querySelectorAll('#new-size button').forEach(b=>b.classList.toggle('on',b===e.currentTarget)); });
  on('#btn-create','click',()=>{ if(!me.name){ toast('Enter your name first'); return; } const size=document.querySelector('#new-size .on').dataset.size; createGame($('#new-name').value.trim(),size); });
  on('#btn-join','click',()=>{ if(!me.name){ toast('Enter your name first'); return; } join($('#join-code').value); });
  on('[data-join]','click',e=>{ if(!me.name){ toast('Enter your name first'); return; } join(e.currentTarget.dataset.join); });
  on('nav.tabs button','click',e=>{ tab=e.currentTarget.dataset.tab; save('hs-tab',tab); render(); });
  on('#btn-start-hiding','click',()=>{ if(!game.hider){ toast('Pick the hider in the Game tab first'); tab='game'; save('hs-tab',tab); render(); return; } patch({phase:'hiding',hidingStartAt:Date.now()}); });
  on('#btn-start-seeking','click',()=>patch({phase:'seeking',seekingStartAt:Date.now()}));
  on('#btn-endgame','click',()=>patch({phase:'endgame',endgameAt:Date.now()}));
  on('#btn-found','click',()=>{ if(confirm('Found means a seeker is within 6\u00bd feet (2 m) of the hider AND has actually spotted them \u2014 being in the right building is not enough.\n\nEnd the round?')) patch({phase:'found',foundAt:Date.now(),bonusAtFound:bonusMinutes()}); });
  on('[data-strict]','click',e=>{ patch({strict:e.currentTarget.dataset.strict==='1'}); });
  on('#btn-leave','click',leave);

  on('[data-cat]','click',e=>{ askState={cat:e.currentTarget.dataset.cat,q:null,custom:'',loc:askState.loc||null,locHow:askState.locHow||''}; render(); });
  on('#btn-back','click',()=>{ askState={cat:null,q:null,custom:'',loc:null,locHow:''}; render(); });
  on('[data-q]','click',e=>{ askState.q=+e.currentTarget.dataset.q; askState.line=null; askState.stn=null; render(); const c=$('#ask-custom'); if(c) c.focus(); });
  on('#ask-custom','input',e=>{ askState.custom=e.target.value; });
  on('#ask-line','change',e=>{ askState.line=e.target.value||null; render(); });
  on('#ask-stn','change',e=>{ askState.stn=+e.target.value; render(); });
  on('[data-hstn]','click',()=>{ hiderAt=null; render(); });
  on('#btn-send','click',sendQuestion);
  on('[data-gps]','click',e=>useGps(e.currentTarget.dataset.gps));
  on('[data-pick]','click',e=>pickOnMap(e.currentTarget.dataset.pick));
  on('[data-arm]','click',e=>{ thermoFinish={qid:e.currentTarget.dataset.arm,loc:null,how:''}; render(); });
  on('#btn-thermo-go','click',finishThermo);
  on('[data-ans]','click',e=>answerQ(e.currentTarget.dataset.qid,e.currentTarget.dataset.ans));
  on('[data-sendtext]','click',e=>{ const id=e.currentTarget.dataset.sendtext; const v=$('#ta-'+id).value.trim(); if(!v){ toast('Type an answer'); return; } answerQ(id,v); });

    const row=document.getElementById('ta-row-'+id); if(row){ row.hidden=false; const i=document.getElementById('ta-'+id); if(i) i.focus(); } });

// The hider has to be within a hiding zone of one of the stations that are
// still possible, so everywhere else is ruled out — and that is the ground

// winding rule would punch the overlaps back in. It is rebuilt only when the
// set of possible stations changes, never on a pan.
let maskSeq=0;
function syncShade(){
  if(!gShade) return;
  const keep=survivors();
  const key=keep?zoneKey()+'|'+(showCircles?'c':'')+'|'+keep.join(''):'';
  if(key===shadeKey) return;
  shadeKey=key; gShade.innerHTML='';
  if(!keep) return;
  const m=M(), B=extentBox(), id='m-poss-'+(++maskSeq);
  const mask=el('mask',{id,maskUnits:'userSpaceOnUse',x:B.x,y:B.y,width:B.w,height:B.h},
                el('defs',{},gShade));
  el('rect',{x:B.x,y:B.y,width:B.w,height:B.h,fill:'#fff'},mask);
  let live=0;
  for(let i=0;i<keep.length;i++){
    if(!keep[i]) continue;
    const st=m.stops[i];
    el('circle',{cx:st[0],cy:st[1],r:zoneRadius(st[1]),fill:'#000'},mask);
    live++;
  }
  // Nothing left standing means the answers contradict each other; greying
  // the whole map would just hide it, so leave it clear and let the counter
  // say so.
  if(!live){ gShade.innerHTML=''; return; }
  el('rect',{x:B.x,y:B.y,width:B.w,height:B.h,class:'m-ruled',mask:'url(#'+id+')'},gShade);
  // The same zones, outlined, for when you want to see each one rather than
  // just the shape their union makes.
  if(showCircles) for(let i=0;i<keep.length;i++){ if(!keep[i]) continue;
    const st=m.stops[i];
    el('circle',{cx:st[0],cy:st[1],r:zoneRadius(st[1]),class:'m-zonering'},gShade); }
}

// --- what an answer rules out ------------------------------------------
// Only the questions whose reference data is actually in this map become
// constraints. Everything else is recorded and left for you to reason about,
// rather than faked.
// --- what an answer rules out -------------------------------------------
// The hider answers from wherever they happen to be, and the rules let them
// roam their whole hiding zone, so a station is ruled out only when NO point
// of its zone could have produced that answer. That is a distance-to-a-region
// question, and it is answered exactly rather than with a slack bound: each
// answer is rasterised into the set of points that could have given it, an
// exact Euclidean distance transform turns that set into a distance field,
// and the station survives iff the field at the station is inside its zone
// radius. Nothing is padded, and nothing possible is ever greyed out.
let poiCache={};
function poiPts(k){
  const z=zoneKey(), c=poiCache[z]||(poiCache[z]={});
  if(c[k]) return c[k];
  c[k]= k==='station' ? M().stations.map(s=>[s.x,s.y,s.n])
      : ((POI_OF(z)[k])||[]).map(q=>{ const xy=project(q[0],q[1]); return [xy[0],xy[1],q[2]||'']; });
  return c[k];
}
const nameLen=s=>(s||'').length;   // hyphens and spaces count, per the card

// Every answered question that carries geometry, as a light description —
// light enough to double as the cache key.
function conFromQ(q){
  if(q.status!=='answered'||!q.answer) return null;
  if(q.cat==='radar'){ if(!q.loc||!q.distM) return null; return {t:'radar',x:q.loc[0],y:q.loc[1],r:q.distM,inside:q.answer==='Yes'}; }
  if(q.cat==='thermo'){ if(!q.loc||!q.loc2) return null; return {t:'thermo',a:q.loc,b:q.loc2,hotter:q.answer==='Hotter'}; }
  if(q.cat==='photo') return null;
  const info=qInfo(q.cat,q.q);
  if(info.nul||info.always||!info.ref) return null;
  const ref=info.ref;
  if(q.cat==='matching'){
    if(q.answer!=='Yes'&&q.answer!=='No') return null;
    const same=q.answer==='Yes';
    // About the hider's station itself, not where in its zone they stand.
    if(ref==='#line') return q.line?{t:'line',line:q.line,same}:null;
    if(ref==='#namelen'){ let L=q.mine&&q.mine.v;
      if(L==null&&q.loc){ const s0=nearStops(q.loc,1)[0]; if(s0) L=nameLen(M().stops[s0.i][2]); }
      return L==null?null:{t:'namelen',L,same}; }
    if(!q.loc) return null;
    const x=q.loc[0], y=q.loc[1];
    if(ref==='#street') return {t:'street',x,y,same};
    if(ref[0]==='!') return {t:'area',k:ref.slice(1),x,y,same};
    return {t:'near',k:ref,x,y,same};
  }
  if(!q.loc) return null;
  const x=q.loc[0], y=q.loc[1];
  if(q.cat==='measuring'){
    if(q.answer!=='Closer'&&q.answer!=='Further') return null;
    const closer=q.answer==='Closer';
    if(ref==='#sea') return {t:'sea',x,y,closer};
    if(ref==='#water') return {t:'water',x,y,closer};
    return {t:'dist',k:ref,x,y,closer};
  }
  if(q.cat==='tentacle'&&q.distM){
    const name=q.answer===NOT_IN_REACH?null:q.answer===IN_REACH_NONE?'__in':q.answer;
    return {t:ref==='#metro'?'mtent':'tent',k:ref,x,y,r:q.distM,name};
  }

}
// Every answered question that carries geometry, as a light description —
// light enough to double as the cache key.
function cons(){ const out=[]; for(const q of questions){ const c=conFromQ(q); if(c) out.push(c); } return out; }

// Resolve the seeker's own side of a comparison. The seeker's position is
// known exactly, so it is measured exactly rather than read off the grid —
// a seeker standing near a Voronoi boundary would otherwise be assigned the
// wrong nearest feature and the whole region would come out wrong.
function segDist(p,a,b){
  const vx=b[0]-a[0], vy=b[1]-a[1], L2=vx*vx+vy*vy;
  if(!L2) return Math.hypot(p[0]-a[0],p[1]-a[1]);
  let t=((p[0]-a[0])*vx+(p[1]-a[1])*vy)/L2;
  t=t<0?0:t>1?1:t;
  return Math.hypot(p[0]-(a[0]+t*vx), p[1]-(a[1]+t*vy));
}
function exactShapeDist(k,p){
  let best=Infinity;
  const rings=SHAPE_SRC[k]?SHAPE_SRC[k]:[].concat(...((AREA_OF(zoneKey())[k])||[]).map(a=>a.r));
  for(const line of rings){
    let prev=null;
    for(const ll of line){
      const q=project(ll[0],ll[1]);
      if(prev){ const d=segDist(p,prev,q); if(d<best) best=d; }
      else { const d=Math.hypot(p[0]-q[0],p[1]-q[1]); if(d<best) best=d; }
      prev=q;
    }

  return best;
}
function exactNearest(pts,p){
  let bi=-1,bd=Infinity;
  for(let i=0;i<pts.length;i++){ const d=Math.hypot(p[0]-pts[i][0],p[1]-pts[i][1]); if(d<bd){bd=d;bi=i;} }
  return {i:bi,d:bd};
}
function pointInRings(rings,p){
  let inside=false;
  for(const ring of rings){
    const pr=ring.map(ll=>project(ll[0],ll[1]));
    for(let i=0,j=pr.length-1;i<pr.length;j=i++){
      const [xi,yi]=pr[i], [xj,yj]=pr[j];
      if((yi>p[1])!==(yj>p[1]) && p[0] < xi+(p[1]-yi)/(yj-yi)*(xj-xi)) inside=!inside;
    }
