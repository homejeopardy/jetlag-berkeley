}
// ---------- reference data beyond the drawn map ----------
// A grid of segments, so "the nearest segment to here" looks at a handful of
// cells rather than every segment on the map. Each segment is filed under
// every cell its bounding box touches, and a search widens ring by ring until
// no unvisited cell could hold anything nearer than what it already has —
// so the answer is exact, not a sample.
function SegIndex(C){ this.C=C||60; this.a=[]; this.id=[]; this.cells=new Map(); this.stamp=null; this.q=0;
  this.bx=[Infinity,Infinity,-Infinity,-Infinity]; }
SegIndex.prototype.add=function(p,q,id){
  const k=this.id.length; this.a.push(p[0],p[1],q[0],q[1]); this.id.push(id);
  const C=this.C, i0=Math.floor(Math.min(p[0],q[0])/C), i1=Math.floor(Math.max(p[0],q[0])/C),
        j0=Math.floor(Math.min(p[1],q[1])/C), j1=Math.floor(Math.max(p[1],q[1])/C);
  for(let i=i0;i<=i1;i++) for(let j=j0;j<=j1;j++){ const key=i*131071+j; let L=this.cells.get(key);
    if(!L){ L=[]; this.cells.set(key,L); } L.push(k); }
  const b=this.bx; b[0]=Math.min(b[0],i0); b[1]=Math.min(b[1],j0); b[2]=Math.max(b[2],i1); b[3]=Math.max(b[3],j1);
};
// Nearest segment to p among those whose id passes `ok`, looking no further
// than `lim` map units. Returns {d, id}; d is Infinity if nothing is that near.
SegIndex.prototype.nearest=function(p,ok,lim){
  if(!this.stamp||this.stamp.length<this.id.length) this.stamp=new Int32Array(this.id.length);
  const q=++this.q, st=this.stamp, A=this.a, C=this.C, x=p[0], y=p[1];
  const ci=Math.floor(x/C), cj=Math.floor(y/C), b=this.bx;
  const maxR=Math.max(ci-b[0],b[2]-ci,cj-b[1],b[3]-cj)+1;
  let best=Infinity, bid=-1; if(lim==null) lim=Infinity;
  for(let r=0;r<=maxR;r++){
    // every cell at ring r is at least (r-1)*C from p
    if(r>0&&(r-1)*C>Math.min(best,lim)) break;
    for(let i=ci-r;i<=ci+r;i++){
      const edge=(i===ci-r||i===ci+r);
      for(let j=cj-r;j<=cj+r;j+=(edge?1:2*r||1)){
        const L=this.cells.get(i*131071+j); if(!L) continue;
        for(let n=0;n<L.length;n++){ const k=L[n]; if(st[k]===q) continue; st[k]=q;
          const id=this.id[k]; if(ok&&!ok(id)) continue;
          const o=4*k, ax=A[o], ay=A[o+1], vx=A[o+2]-ax, vy=A[o+3]-ay, L2=vx*vx+vy*vy;
          let t=L2?((x-ax)*vx+(y-ay)*vy)/L2:0; t=t<0?0:t>1?1:t;
          const dx=x-ax-t*vx, dy=y-ay-t*vy, d=Math.sqrt(dx*dx+dy*dy);
          if(d<best){ best=d; bid=id; } }
      }
    }
  }
  return best<=lim?{d:best,id:bid}:{d:Infinity,id:-1};
};
// A fixed set of polylines as flat segment arrays with a bounding box: for
// one street or one rail line, looking at every segment is quicker than any
// index, and the box answers "further than lim" without looking at all.
function segSet(lines){ const a=[]; let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const l of lines) for(let i=1;i<l.length;i++){ a.push(l[i-1][0],l[i-1][1],l[i][0],l[i][1]);
    x0=Math.min(x0,l[i][0],l[i-1][0]); x1=Math.max(x1,l[i][0],l[i-1][0]); y0=Math.min(y0,l[i][1],l[i-1][1]); y1=Math.max(y1,l[i][1],l[i-1][1]); }
  return {a:new Float64Array(a),x0,y0,x1,y1}; }
function segSetDist(S,p,lim){
  const bx=Math.max(S.x0-p[0],0,p[0]-S.x1), by=Math.max(S.y0-p[1],0,p[1]-S.y1);
  if(lim!=null&&Math.hypot(bx,by)>lim) return Infinity;
  const A=S.a, x=p[0], y=p[1]; let best=Infinity;
  for(let o=0;o<A.length;o+=4){ const ax=A[o], ay=A[o+1], vx=A[o+2]-ax, vy=A[o+3]-ay, L2=vx*vx+vy*vy;
    let t=L2?((x-ax)*vx+(y-ay)*vy)/L2:0; t=t<0?0:t>1?1:t;
    const dx=x-ax-t*vx, dy=y-ay-t*vy, d=dx*dx+dy*dy; if(d<best) best=d; }
  best=Math.sqrt(best); return lim!=null&&best>lim?Infinity:best; }
const cosAt=y=>Math.cos(latAt(y)*Math.PI/180);
const trueM=(d,y)=>d*cosAt(y);          // map units -> real metres at that latitude

// Streets and paths, as the rulebook defines them (see tools/build_extras.py).
const STREET_WORD={footway:'footpath',path:'path',steps:'stairway',motorway_link:'freeway ramp',
  cycleway:'bike path',residential:'street',pedestrian:'pedestrian walkway',service:'service road',
  track:'track',tertiary_link:'slip road',secondary_link:'slip road',primary_link:'slip road',
  unclassified:'road',tertiary:'road',primary:'road',secondary:'road',motorway:'freeway'};
let streetCache={};
function streets(){
  const z=zoneKey(); if(streetCache[z]) return streetCache[z];
  const ents=[], idx=new SegIndex(40);
  const src=MAPDATA.streets||'';
  for(const line of src.split('\n')){ if(!line) continue;
    const [n,k,body]=line.split('|'); const id=ents.length, lines=[];
    for(const part of body.split(';')){ const v=part.split(','); let x=0,y=0; const pts=[];
      for(let i=0;i<v.length;i+=2){ x+=+v[i]; y+=+v[i+1]; pts.push(project(x/1e5,y/1e5)); }
      for(let i=1;i<pts.length;i++) idx.add(pts[i-1],pts[i],id);
      lines.push(pts); }
    ents.push({n,k,lines}); }
  return streetCache[z]={ents,idx};
}
function streetSegs(j){ const e=streets().ents[j]; return e.segs||(e.segs=segSet(e.lines)); }
function streetName(e){ return e.n||('an unnamed '+(STREET_WORD[e.k]||e.k)); }
function nearestStreet(p){ const S=streets(); const r=S.idx.nearest(p); return r.id<0?null:{j:r.id,d:r.d,e:S.ents[r.id]}; }

// Terrain for Sea level: elevation in metres on a lon/lat grid, bilinear
// between posts. Outside the grid there is no answer, and nothing is guessed.
let TER=null;
function terrain(){
  if(TER) return TER; const T=MAPDATA.terrain; if(!T) return null;
  const bin=atob(T.b64), u8=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  return TER=Object.assign({v:new Int16Array(u8.buffer)},T);
}
function elevLL(lon,lat){
  const T=terrain(); if(!T) return NaN;
  const fx=(lon-T.x0)/T.dx, fy=(lat-T.y0)/T.dy;
  if(!(fx>=0&&fy>=0&&fx<=T.nx-1&&fy<=T.ny-1)) return NaN;
  const i=Math.min(Math.floor(fx),T.nx-2), j=Math.min(Math.floor(fy),T.ny-2), tx=fx-i, ty=fy-j, v=T.v, n=T.nx;
  const a=v[j*n+i], b=v[j*n+i+1], c=v[(j+1)*n+i], d=v[(j+1)*n+i+1];
  return ((a*(1-tx)+b*tx)*(1-ty)+(c*(1-tx)+d*tx)*ty)/10;
}
function elevXY(p){ const a=unproject(p[0],p[1]); return elevLL(a[1],a[0]); }
// The steepest the terrain model gets anywhere in a square, in metres of
// height per map unit: within one grid cell the bilinear surface can climb
// no faster than its steeper pair of opposite edges.
function slopeIn(cx,cy,h){
  const T=terrain(); if(!T) return NaN;
  const A=unproject(cx-h,cy-h), B=unproject(cx+h,cy+h);          // [lat,lon]
  const lon0=Math.min(A[1],B[1]), lon1=Math.max(A[1],B[1]), lat0=Math.min(A[0],B[0]), lat1=Math.max(A[0],B[0]);
  const i0=Math.floor((lon0-T.x0)/T.dx), i1=Math.floor((lon1-T.x0)/T.dx);
  const j0=Math.floor((lat0-T.y0)/T.dy), j1=Math.floor((lat1-T.y0)/T.dy);
  if(i0<0||j0<0||i1>T.nx-2||j1>T.ny-2) return NaN;
  const v=T.v, n=T.nx; let gx=0, gy=0, g=0;
  for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++){
    const a=v[j*n+i], b=v[j*n+i+1], c=v[(j+1)*n+i], d=v[(j+1)*n+i+1];
    gx=Math.max(Math.abs(b-a),Math.abs(d-c))/10/T.dx; gy=Math.max(Math.abs(c-a),Math.abs(d-b))/10/T.dy;
    const s=Math.hypot(gx,gy); if(s>g) g=s; }
  // metres per degree -> metres per map unit (a degree of latitude is at
  // least as many map units as a degree of longitude, so this bounds both)
  return g*180/(Math.PI*R)*1.0001;
}

// Named water on the map, with San Francisco Bay as its shoreline.
let waterCache={};
function waters(){
  const z=zoneKey(); if(waterCache[z]) return waterCache[z];
  const list=(M().water||[]).map((w,i)=>{ const pr=projRings('w:'+i,w.r); return {n:w.n,pr,box:segSet(pr)}; });
  const idx=new SegIndex(250);
  list.forEach((w,i)=>{ for(const r of w.pr) for(let k=1;k<r.length;k++) idx.add(r[k-1],r[k],i); });
  const bay=list.length;
  if(SHAPE_SRC.coast) for(const r of shapeRings('coast')) for(let k=1;k<r.length;k++) idx.add(r[k-1],r[k],bay);
  const names=list.map(w=>w.n).concat(SHAPE_SRC.coast?['San Francisco Bay']:[]);
  return waterCache[z]={list,idx,names};
}
// Distance to the nearest named water, zero on it.
function nearestWater(p,lim){
  const W=waters();
  for(let i=0;i<W.list.length;i++){ const b=W.list[i].box;
    if(p[0]>=b.x0&&p[0]<=b.x1&&p[1]>=b.y0&&p[1]<=b.y1&&ringsInside(W.list[i].pr,p)) return {d:0,j:i,n:W.names[i]}; }
  const r=W.idx.nearest(p,null,lim); return r.id<0?(lim!=null?{d:Infinity,j:-1,n:''}:null):{d:r.d,j:r.id,n:W.names[r.id]};
}

// BART lines, for the Metro lines tentacle. Orange and Red share every
// metre of track on this map; a line identical to another is the same
// answer, so each line knows which others it cannot be told apart from.
let metroCache={};
function metro(){
  const z=zoneKey(); if(metroCache[z]) return metroCache[z];
  const src=MAPDATA.metro||{}, names=Object.keys(src), idx=new SegIndex(80), sig={};
  const sets=[];
  names.forEach((n,i)=>{ const ws=src[n].map(w=>w.map(ll=>project(ll[0],ll[1])));
    sig[n]=JSON.stringify(src[n].map(w=>JSON.stringify(w)).sort());
    sets.push(segSet(ws)); });
  const twin=names.map(a=>names.map((b,j)=>sig[a]===sig[b]?j:-1).filter(j=>j>=0));
  return metroCache[z]={names,sets,twin};
}
function metroDist(p,i){ return segSetDist(metro().sets[i],p); }

// Hiding stations and the lines that stop at them.
const stopLines=st=>(st[3]||'').split(';').filter(Boolean);
function allLines(){
  const seen=new Set(); for(const st of M().stops) for(const l of stopLines(st)) seen.add(l);
  return [...seen];
}
function nearStops(p,n){
  const m=M(); return m.stops.map((st,i)=>({i,d:Math.hypot(st[0]-p[0],st[1]-p[1])}))
    .sort((a,b)=>a.d-b.d).slice(0,n);
}

// ---------- each question's reference ----------
// What a question is about, and what it cannot be about on this map. Every
// ask shows the seeker their own side before it goes, and every answer shows
// the hider theirs, from the same code, so both read the same map.
const NULL_WHY={
 'Coastline':'There is no coastline on this map: by the rulebook, water only counts as ocean coast if it reaches the ocean without narrowing under 2 km (1¼ mi), and San Francisco Bay reaches it through the Golden Gate, which is narrower.',
 'High-speed train line':'There is no high-speed rail line on this map.',
 'International border':'There is no international border on this map.',
 '1st administrative division border (state)':'There is no state border on this map.'};
const ALWAYS_WHY={
 '1st administrative division (state)':'The whole map is in California.',
 'Landmass':'The whole map is on one landmass.'};
function qInfo(cat,text){
  const ref=cat==='tentacle'?tentRef(text):REF[text]||null;
  if(NULL_WHY[text]) return {nul:NULL_WHY[text]};
  if(ALWAYS_WHY[text]) return {always:ALWAYS_WHY[text]};
  if(!ref) return {};
  if(ref[0]==='!'){ const a=AREA_OF(zoneKey())[ref.slice(1)]||[];
    const w=ref==='!city'?'city':ref==='!district'?'district':'county';
    if(a.length===1) return {ref,always:'The whole map is in '+a[0].n+(w==='district'?'':'')+'.'};
    if(a.length===0) return {ref,nul:'This map has no '+w+' data.'};
    return {ref}; }
  if(ref[0]==='@') return areaCountOf(ref.slice(1))?{ref}:{ref,nul:'There is no '+ref.slice(1)+' on this map.'};
  if(ref[0]==='#') return {ref};
  if(!poiPts(ref).length) return {ref,nul:'There is no '+(REF_NOUN[ref]||ref).replace(/^an? /,'')+' on this map, and the rules say anything off the map does not exist.'};
  return {ref};
}
function tentRef(text){ for(const c of CATS) if(c.id==='tentacle') for(const q of c.qs) if(q[0]===text) return q[3]||(text.startsWith('Metro')?'#metro':null); return null; }
function areaCountOf(k){ const a=AREA_OF(zoneKey())[k]; if(a) return a.length; return (SHAPE_SRC[k]||[]).length; }
function areaAt(k,p){
  const list=AREA_OF(zoneKey())[k]||[];
  for(let i=0;i<list.length;i++) if(ringsInside(projRings('a:'+k+':'+i,list[i].r),p)) return i;
  return -1;
}
// One side of a question at one spot: {txt, n, d, v, id} — txt is what to
// show a person; id/v are what the other side is compared against.
function sideAt(cat,text,p,opt){
  opt=opt||{};
  const info=qInfo(cat,text); if(info.nul) return {nul:info.nul};
  if(info.always) return {always:info.always,txt:info.always};
  const ref=info.ref; if(!ref||!p) return null;
  const y=p[1];
  if(cat==='tentacle'){
    const R=metres(opt.distM,y);
    if(ref==='#metro'){ const Mt=metro(), out=[];
      Mt.names.forEach((n,i)=>{ const d=metroDist(p,i); if(opt.all||d<=R) out.push({n,du:d,d:trueM(d,y)}); });
      out.sort((a,b)=>a.du-b.du);
      return {list:out,txt:out.length?out.map(o=>lineName(o.n)+' ('+fmtDist(o.d)+')').join(' · '):'none within '+fmtDist(opt.distM)}; }
    const out=[], seen={};
    for(const t of poiPts(ref)){ if(!t[2]) continue; const d=Math.hypot(t[0]-p[0],t[1]-p[1]);
      if(d<=R&&!seen[t[2]]){ seen[t[2]]=1; out.push({n:t[2],du:d,d:trueM(d,y)}); } }
    out.sort((a,b)=>a.du-b.du); return {list:out,txt:out.length?out.map(o=>o.n+' ('+fmtDist(o.d)+')').join(' · '):'none within '+fmtDist(opt.distM)};
  }
  if(ref==='#line'){
    const here=nearStops(p,8).filter(s=>s.d<=metres(250,y)), near=[];
    for(const s of here) for(const l of stopLines(M().stops[s.i])) if(!near.includes(l)) near.push(l);
    const v=opt.line||null;
    return {options:near.concat(allLines().filter(l=>!near.includes(l)).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}))),
      v, n:v, txt:v?'You are riding '+lineName(v):'Pick the line you are riding'};
  }
  if(ref==='#namelen'){
    const cand=nearStops(p,6), m=M();
    const i=opt.stn!=null&&m.stops[opt.stn]?+opt.stn:(cand.length?cand[0].i:-1); if(i<0) return null;
    const nm=m.stops[i][2]||''; 
    return {options:cand.map(c=>({i:c.i,n:m.stops[c.i][2],d:trueM(c.d,y)})), id:i, n:nm, v:nameLen(nm),
      txt:'“'+nm+'” — '+nameLen(nm)+' characters'};
  }
  if(ref==='#street'){ const s=nearestStreet(p); if(!s) return null;
    return {id:s.j,n:streetName(s.e),du:s.d,d:trueM(s.d,y),txt:streetName(s.e)+' ('+fmtDist(trueM(s.d,y))+' away)'}; }
  if(ref==='#sea'){ const e=elevXY(p); if(!isFinite(e)) return {nul:'That spot is outside the terrain data, so it can’t be measured.'};
    return {v:e,du:Math.abs(e),d:Math.abs(e),txt:Math.round(e*3.28084)+' ft ('+Math.round(e)+' m) above sea level'}; }
  if(ref==='#water'){ const w=nearestWater(p); if(!w) return null;
    return {id:w.j,n:w.n,du:w.d,d:trueM(w.d,y),txt:w.n+' ('+(w.d?fmtDist(trueM(w.d,y)):'you’re on it')+')'}; }
  if(ref[0]==='!'){ const k=ref.slice(1), j=areaAt(k,p), list=AREA_OF(zoneKey())[k]||[];
    return j<0?{id:-1,n:'',txt:'Not inside any '+k+' on this map'}:{id:j,n:list[j].n,txt:list[j].n}; }
  if(ref[0]==='@'){ const d=ringsDist(shapeRings(ref.slice(1)),p);
    return {du:d,d:trueM(d,y),txt:fmtDist(trueM(d,y))+' from the '+(ref==='@countyline'?'county line':ref.slice(1))}; }
  const pts=poiPts(ref), n=exactNearest(pts,p); if(n.i<0) return null;
  const nm=pts[n.i][2]||'unnamed';
  return {id:n.i,n:nm,du:n.d,d:trueM(n.d,y),txt:nm+' ('+fmtDist(trueM(n.d,y))+')'};
}
function lineName(l){ return /^(Yellow|Orange|Red|Green|Blue)$/.test(l)?'BART '+l+' line':(l==='Capitol Corridor'?'Amtrak Capitol Corridor':'AC Transit '+l); }
// The answer the hider's own side gives, compared against the seeker's side
// the question carries. Station-level cards read the hiding station itself.
function suggest(q,p,hz){
  const info=q.cat==='radar'||q.cat==='thermo'||q.cat==='photo'?{}:qInfo(q.cat,q.q);
  if(info.nul) return {ans:null,why:'Null here — '+info.nul+' Any answer tells them nothing; it still counts as asked.'};
  if(info.always) return {ans:q.cat==='matching'?'Yes':null,why:info.always};
  // Compared in map units, exactly as the map narrows, so a truthful answer
  // can never rule out the station it came from.
  if(q.cat==='radar'){ if(!p||!q.loc) return null; const du=Math.hypot(p[0]-q.loc[0],p[1]-q.loc[1]);
    return {ans:du<=metres(q.distM,q.loc[1])?'Yes':'No',why:'You are '+fmtDist(trueM(du,q.loc[1]))+' from where they asked.'}; }
  if(q.cat==='thermo'){ if(!p||!q.loc||!q.loc2) return null;
    const a=Math.hypot(p[0]-q.loc[0],p[1]-q.loc[1]), b=Math.hypot(p[0]-q.loc2[0],p[1]-q.loc2[1]);
    return {ans:b<a?'Hotter':b>a?'Colder':null,why:'Their start is '+fmtDist(trueM(a,p[1]))+' from you, their finish '+fmtDist(trueM(b,p[1]))+'.'}; }
  const ref=info.ref;
  if(q.cat==='matching'&&(ref==='#line'||ref==='#namelen')){
    if(!hz) return {ans:null,why:'Set your hiding station on the map (Zone) and this card is answered from it.'};
    const st=M().stops.find(s=>Math.abs(s[0]-hz.x)<1&&Math.abs(s[1]-hz.y)<1&&s[2]===hz.n)||[hz.x,hz.y,hz.n,''];
    if(ref==='#line'){ const has=stopLines(st).includes(q.line);
      return {ans:has?'Yes':'No',why:'Your station, '+st[2]+', is served by '+(stopLines(st).join(', ')||'nothing listed')+'.'}; }
    const L=nameLen(st[2]), sL=q.mine?q.mine.v:null;
    return {ans:sL==null?null:(L===sL?'Yes':'No'),why:'Your station “'+st[2]+'” is '+L+' characters; theirs is '+sL+'.'};
  }
  if(!p) return null;
  const me=sideAt(q.cat,q.q,p,{distM:q.distM,all:1}); if(!me) return null;
  if(me.nul) return {ans:null,why:me.nul};
  if(q.cat==='tentacle'){
    const du=Math.hypot(p[0]-q.loc[0],p[1]-q.loc[1]);
    if(du>metres(q.distM,q.loc[1])) return {ans:NOT_IN_REACH,why:'You are '+fmtDist(trueM(du,q.loc[1]))+' from them — outside the '+fmtDist(q.distM)+'.'};
    const opts=(q.mine&&q.mine.list)?q.mine.list.map(o=>o.n):null;
    if(q.ref==='#metro'){ const all=(me.list||[]).filter(o=>!opts||opts.includes(o.n));
      if(opts&&!opts.length) return {ans:IN_REACH_NONE,why:'You are in reach, but no metro line is within reach of them.'};
      if(!all.length) return null; const best=all[0], tie=all.filter(o=>Math.abs(o.du-best.du)<0.01).map(o=>o.n);
      return {ans:best.n,why:'Nearest to you: '+(tie.length>1?tie.join(' and ')+' (the same track — either is true)':best.n+' ('+fmtDist(best.d)+')')+'.'}; }
    if(opts&&!opts.length) return {ans:IN_REACH_NONE,why:'You are within '+fmtDist(q.distM)+' of them, but there is nothing of that kind within reach of them to name.'};
    // nearest of the ones in reach of the seeker, measured from you
    const pts=poiPts(q.ref); let bn=null, bd=Infinity;
    for(const t of pts){ if(!t[2]||(opts&&!opts.includes(t[2]))) continue; const dd=Math.hypot(t[0]-p[0],t[1]-p[1]); if(dd<bd){ bd=dd; bn=t[2]; } }
    return bn?{ans:bn,why:'Nearest to you: '+bn+' ('+fmtDist(trueM(bd,p[1]))+').'}:null;
  }
  const them=q.mine;
  if(q.cat==='matching'){ if(!them) return {ans:null,why:'Yours: '+me.txt+'.'};
    if(me.id===-1||them.id===-1) return {ans:null,why:'Yours: '+me.txt+'. Theirs: '+them.txt+'. One of you is off this map’s data, so the app can’t call it.'};
    const same=me.id===them.id;
    return {ans:same?'Yes':'No',why:'Yours: '+me.txt+'. Theirs: '+them.txt+'.'}; }
  if(q.cat==='measuring'){ if(!them||!isFinite(them.d)) return {ans:null,why:'Yours: '+me.txt+'.'};
    const a=me.du, b=them.du!=null?them.du:them.d;
    return {ans:a<b?'Closer':a>b?'Further':null,why:'Yours: '+me.txt+'. Theirs: '+them.txt+'.'+(a===b?' Exactly equal.':'')}; }
  return null;
}

// ---------- exact survival ----------
// A station survives an answer when some point of its hiding zone could have
// produced that answer. Every answer is expressed as a clearance function
// phi(p): at or above zero exactly where the answer is possible, and never
// changing faster than distance itself. That Lipschitz bound is what makes
// the search below a proof rather than a sample: a square whose centre sits
// further below zero than its own half-diagonal cannot contain a qualifying
// point anywhere, so it is discarded whole. No grid, no padding, and no
// elimination that a finer mesh would undo.
const PHI_EPS_M=0.01;            // certify down to a centimetre
function reaches(phi,S,rho,eps){
  const p0=phi(S);
  if(p0>=0) return true;         // the station itself could have answered
  if(p0+rho<0) return false;     // and no point of its zone can reach
  // g is >=0 exactly at a point that is both inside the zone and qualifying.

  if(c.t==='dist'){
    if(!isFinite(P.ds)) return null;
    // The ground within ds of the reference: discs round points, and for a
    // coastline the line itself stroked 2*ds wide with round ends, which is
    // exactly the set of points within ds of it.
    if(c.k[0]==='@'){ for(const line of shapeRings(c.k.slice(1)))
        sh.push({t:'path',stroke:2*P.ds,a:{d:'M'+line.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join('L')}}); }
    else for(const q of poiPts(c.k)) sh.push(circ(q[0],q[1],P.ds));
    return {mode:c.closer?'out':'in',sh}; }
  if(c.t==='near'){
    if(P.j<0) return null;
    const pl=cellPoly(poiPts(c.k),P.j); if(!pl) return null;
    sh.push(poly(pl)); return {mode:c.same?'out':'in',sh}; }
  if(c.t==='tent'){
    const R=metres(c.r,c.y);
    if(c.name==null){ sh.push(circ(c.x,c.y,R)); return {mode:'in',sh}; }
    if(c.name==='__in'){ sh.push(circ(c.x,c.y,R)); return {mode:'out',sh}; }
    if(P.j<0) return null;
    const pl=P.sub.length?cellPoly(P.sub,P.j):null; if(!pl) return null;
    sh.push({t:'path',clipCircle:[c.x,c.y,R],a:{d:polyD(pl)}});
    return {mode:'out',sh}; }
  if(c.t==='area'){
    const list=AREA_OF(zoneKey())[c.k]||[]; if(P.j<0) return null;
    for(const r of projRings('a:'+c.k+':'+P.j,list[P.j].r)) sh.push(poly(r));
    return {mode:c.same?'out':'in',sh}; }
  if(c.t==='water'){
    if(!isFinite(P.ds)) return null;
    // Within ds of named water: the water itself, and a band 2*ds wide
    // round every edge of it — the Bay's shoreline included.
    const lineD=r=>'M'+r.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join('L');
    for(const w of waters().list){
      sh.push({t:'path',a:{d:w.pr.map(r=>lineD(r)+'Z').join(''),'fill-rule':'evenodd'}});
      if(P.ds>0) for(const r of w.pr) sh.push({t:'path',stroke:2*P.ds,a:{d:lineD(r)+'Z'}}); }
    if(SHAPE_SRC.coast&&P.ds>0) for(const r of shapeRings('coast')) sh.push({t:'path',stroke:2*P.ds,a:{d:lineD(r)}});
    return {mode:c.closer?'out':'in',sh}; }
  if(c.t==='mtent'&&(c.name==null||c.name==='__in')){ sh.push(circ(c.x,c.y,metres(c.r,c.y))); return {mode:c.name==null?'in':'out',sh}; }
  // Station cards (line, name length), streets, sea level and metro lines
  // are shown by what they leave standing: the stations greyed out.
  return null;
}
let clipSeq=0;
function putShape(s,parent,fill){
  const a=Object.assign({},s.a);
  if(s.stroke){ a.fill='none'; a.stroke=fill; a['stroke-width']=s.stroke; a['stroke-linecap']='round'; a['stroke-linejoin']='round'; }
  else a.fill=fill;
  if(s.clipCircle){ const id='jl-cc-'+(++clipSeq);
    const cp=el('clipPath',{id,clipPathUnits:'userSpaceOnUse'},el('defs',{},parent));
    el('circle',{cx:s.clipCircle[0],cy:s.clipCircle[1],r:s.clipCircle[2]},cp);
    a['clip-path']='url(#'+id+')'; }
  return el(s.t,a,parent);
}
function syncAnswers(){
  if(!gAns) return;
  const cs=cons();
  const key=zoneKey()+'|'+JSON.stringify(cs)+'|'+Object.keys(conOff).sort().join(',');
  if(key===ansKey) return;
  ansKey=key; gAns.innerHTML=''; gCons.innerHTML='';
  // A flat tint, not a hatch pattern: patterns are re-rasterised on every
  // frame of a zoom and were the whole of the stutter. Full-strength fills
  // inside one translucent group read as a single union however many
  // answers overlap.
  const B=extentBox();
  for(let i=0;i<cs.length;i++){
    if(conOff[i]) continue;
    const ex=excluded(cs[i]);
    if(ex&&ex.sh.length){
      const g=el('g',{class:'m-ans','data-ci':i},gAns);
      if(ex.mode==='in') for(const s of ex.sh) putShape(s,g,'var(--ans-fill)');
      else { const id='jl-am-'+i;
        const mk=el('mask',{id,maskUnits:'userSpaceOnUse',x:B.x,y:B.y,width:B.w,height:B.h},el('defs',{},g));
        el('rect',{x:B.x,y:B.y,width:B.w,height:B.h,fill:'#fff'},mk);
        for(const s of ex.sh) putShape(s,mk,'#000');
        el('rect',{x:B.x,y:B.y,width:B.w,height:B.h,fill:'var(--ans-fill)',mask:'url(#'+id+')'},g); }
    }
    drawOne(cs[i],i,gCons,1e9);   // outlines only; markers live in the dynamic layer
  }
}
// The hatch keeps a constant spacing on screen however far you zoom.
function sizeHatch(){}
function drawMarkers(at){
  const cs=cons();
  for(let i=0;i<cs.length;i++){ if(conOff[i]) continue; const c=cs[i], col=conColor(i);
    if(c.t==='thermo'){
      el('circle',{r:4.5,fill:'#fff',stroke:col,'stroke-width':2.5},at(c.a[0],c.a[1]));
      el('circle',{r:4.5,fill:col,stroke:'#fff','stroke-width':2},at(c.b[0],c.b[1]));
    } else if(c.x!=null) el('circle',{r:4.5,fill:col,stroke:'#fff','stroke-width':2},at(c.x,c.y));
  }
}

return {
  project(lon,lat){ return project(lon,lat).map(Math.round); },
  // Straight-line distance between two projected points, in real metres.
  trueMetres(a,b){
    const d=Math.hypot(a[0]-b[0],a[1]-b[1]);
    return d*Math.cos(latAt((a[1]+b[1])/2)*Math.PI/180);
  },
  near(loc){
    const m=M(); let best=null,bd=Infinity;
    for(const st of m.stations){ const d=Math.hypot(loc[0]-st.x,loc[1]-st.y); if(d<bd){bd=d;best=st.n;} }
    for(const p of m.stops){ const d=Math.hypot(loc[0]-p[0],loc[1]-p[1]); if(d<bd){bd=d;best=p[2]||'an unnamed stop';} }
    return best?`near ${best}`:'an unknown spot';
  },
  cutBy(q){
    if(q.status!=='answered'||q.cat==='photo') return '';
    const info=(q.cat==='radar'||q.cat==='thermo')?{}:qInfo(q.cat,q.q);
    if(info.nul) return 'Null here — '+info.nul+' By the rules the answer tells you nothing. It still counts as asked.';
    if(info.always) return 'Always yes here — '+info.always+' It tells you nothing, and still counts as asked.';
    const c=conFromQ(q);
    if(!c){ if(q.cat==='matching'&&info.ref==='#line'&&!q.line) return 'Not drawn — no line was recorded with it.';
      return q.loc?'':'Not drawn — no location was recorded with it.'; }
    const mk=stopMask(c); let out=0; for(let i=0;i<mk.length;i++) if(!mk[i]) out++;
    const n=REF_NOUN[info.ref]||'it';
    let what='';
    if(q.cat==='radar') what=q.answer==='Yes'?`They were within ${fmtDist(q.distM)} of there when they answered; everything beyond is shaded.`
      :`They were not within ${fmtDist(q.distM)} of there when they answered; the inside of that circle is shaded.`;
    else if(q.cat==='thermo') what=q.answer==='Hotter'?'They were nearer the finish than the start; the start side of the line is shaded.'
      :'They were nearer the start than the finish; the finish side of the line is shaded.';
    else if(c.t==='line') what=q.answer==='Yes'?`Their station is served by ${lineName(q.line)}; every station it doesn't serve is out.`
      :`Their station is not served by ${lineName(q.line)}; every station it serves is out.`;
    else if(c.t==='namelen') what=q.answer==='Yes'?`Their station's name is ${c.L} characters long; every other station is out.`
      :`Their station's name is not ${c.L} characters long; every station that is, is out.`;
    else if(c.t==='street') what=q.answer==='Yes'?'Their nearest street or path is the one highlighted.':'Their nearest street or path is not the one highlighted.';
    else if(c.t==='sea') what=q.answer==='Closer'?'They were closer to sea level than this spot.':'They were further from sea level than this spot.';
    else if(c.t==='water') what=q.answer==='Closer'?'They were closer to a body of water than this was; everywhere further is shaded.'
      :'They were further from a body of water than this was; everywhere nearer is shaded.';
    else if(q.cat==='measuring') what=q.answer==='Closer'?`They were closer to ${info.ref==='@countyline'?'the county line':n} than this was; everywhere further is shaded.`
      :`They were further from ${info.ref==='@countyline'?'the county line':n} than this was; everywhere nearer is shaded.`;
    else if(q.cat==='matching'){
      const thing=info.ref==='!city'?'city':info.ref==='!district'?'district':info.ref==='!county'?'county':'nearest '+esc(q.q).toLowerCase();
      what=q.answer==='Yes'?`Same ${thing} as here; everywhere else is shaded.`:`A different ${thing} from here; this one is shaded.`;
    } else if(q.cat==='tentacle') what=q.answer===NOT_IN_REACH?'Not within reach; the circle is shaded.':q.answer===IN_REACH_NONE?'Within reach, with nothing to name; everything outside the circle is shaded.'
      :`Nearest to ${q.answer}.`;
    const st=out?` Rules out ${out} station${out===1?'':'s'}.`
      :' Rules out no station on its own — every hiding zone still reaches ground where that answer is possible.';
    return what+st;
  },

  // The candidates a tentacle question can honestly be answered with: the
  // ones of that type within range of where the seeker asked from.
  tentacleOptions(q){
    if(q.cat!=='tentacle'||!q.loc||!q.distM) return [];
    const r=sideAt('tentacle',q.q,q.loc,{distM:q.distM});
    return r&&r.list?r.list.map(o=>o.n):[];
  },
  sideAt, suggest, qInfo, lineName,

  refCount(k){ try{ return poiPts(k).length; }catch(e){ return 0; } },
  hideStop(){ return load(hideKey()); },
  areaCount(k){ const a=AREA_OF(zoneKey())[k]; if(a) return a.length;
    return (SHAPE_SRC[k]||[]).length; },
  count(){
    const cs=cons(); if(!cs.length) return {cons:0};
    const keep=survivors(); let left=0;
    for(let i=0;i<keep.length;i++) left+=keep[i];
    return {cons:cs.length,left,total:keep.length};
  },
  show(){
    initLeaflet();
    bind();
    if(built!==zoneKey()) build(); else { fit(); }
    if(lmap) setTimeout(()=>{ lmap.invalidateSize(); fit(); },0);
    const zb=document.getElementById('mp-zone'); zb.hidden=!isHider();
    document.getElementById('mp-circles').classList.toggle('on',showCircles);
    const mb=document.getElementById('mp-map');
    mb.textContent=MAPS[zoneKey()].label;
    mb.title='Switch the map everyone is using';
    tip(null);
  },
  syncPins(){ if(built&&!document.getElementById('mapview').hidden) redraw(); },
  reset(){ built=null; fix=null; sel=null; shadeKey='';
    poiCache={}; ringCache={}; stopMaskCache={}; ansKey='';
    if(watchId!==null){ try{navigator.geolocation.clearWatch(watchId);}catch(e){} watchId=null;
      const b=document.getElementById('mp-loc'); if(b) b.classList.remove('on'); } }
};
})();

})();
